<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aEye — Global Camera Network</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #00f0ff;
  --accent2: #ff006e;
  --accent3: #39ff14;
  --bg: #06080c;
  --bg2: #0c1018;
  --bg3: #121824;
  --surface: rgba(12,16,24,0.92);
  --border: rgba(0,240,255,0.15);
  --text: #c8d6e5;
  --text-dim: #5a6a7a;
  --glow: 0 0 20px rgba(0,240,255,0.3);
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Outfit', sans-serif;
  --pin-size: 0.45;
  --rotation-speed: 0.15;
  --grid-cols: 4;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font-mono); }

/* ========== GLOBE CONTAINER ========== */
#globe-container { position:fixed; inset:0; z-index:1; }

/* ========== TOP BAR ========== */
#topbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px; pointer-events:none;
}
#topbar > * { pointer-events:auto; }
#logo {
  font-family:var(--font-display); font-weight:800; font-size:24px;
  letter-spacing:2px; color:var(--accent);
  text-shadow:0 0 30px rgba(0,240,255,0.5), 0 0 60px rgba(0,240,255,0.2);
  cursor:default; user-select:none; display:flex; align-items:center; gap:10px;
}
#logo .eye { font-size:28px; filter:drop-shadow(0 0 8px var(--accent)); }
#logo .sub {
  font-family:var(--font-mono); font-size:10px; font-weight:300;
  color:var(--text-dim); letter-spacing:4px; text-transform:uppercase;
  margin-left:4px;
}
.topbar-controls { display:flex; gap:8px; align-items:center; }

/* ========== BUTTONS ========== */
.btn-icon {
  width:40px; height:40px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; transition:all 0.2s; backdrop-filter:blur(12px);
  position:relative;
}
.btn-icon:hover {
  border-color:var(--accent); color:var(--accent);
  box-shadow:var(--glow); transform:translateY(-1px);
}
.btn-icon.active { border-color:var(--accent); color:var(--accent); background:rgba(0,240,255,0.08); }
.btn-icon .badge {
  position:absolute; top:-4px; right:-4px; width:16px; height:16px;
  border-radius:50%; background:var(--accent2); color:#fff;
  font-size:9px; display:flex; align-items:center; justify-content:center;
  font-weight:700;
}

/* ========== TOOLTIP ========== */
#tooltip {
  position:fixed; z-index:200; pointer-events:none;
  padding:6px 12px; border-radius:6px; font-size:11px;
  background:var(--surface); border:1px solid var(--border);
  backdrop-filter:blur(12px); color:var(--accent);
  font-family:var(--font-mono); letter-spacing:0.5px;
  opacity:0; transition:opacity 0.15s;
  white-space:nowrap; max-width:300px;
}
#tooltip.visible { opacity:1; }
#tooltip .tt-city { color:var(--text-dim); font-size:10px; margin-top:2px; }

/* ========== PREVIEW POPUP ========== */
#preview-overlay {
  position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center;
  animation:fadeIn 0.2s;
}
#preview-overlay.open { display:flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

#preview-card {
  width:min(560px, 90vw); background:var(--bg2); border:1px solid var(--border);
  border-radius:16px; overflow:hidden; position:relative;
  box-shadow:0 0 60px rgba(0,240,255,0.1), 0 20px 60px rgba(0,0,0,0.5);
  animation:slideUp 0.25s ease-out;
}
@keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }

#preview-card .preview-img {
  width:100%; aspect-ratio:16/9; object-fit:cover; display:block;
  background:var(--bg3);
}
#preview-card .preview-video {
  width:100%; aspect-ratio:16/9; border:none; display:none; background:#000;
}
#preview-card .preview-info {
  padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
}
#preview-card .preview-info .left { flex:1; }
#preview-card .cam-name {
  font-family:var(--font-display); font-weight:600; font-size:16px; color:#fff;
}
#preview-card .cam-loc {
  font-size:11px; color:var(--text-dim); margin-top:4px;
  letter-spacing:1px; text-transform:uppercase;
}
#preview-card .preview-actions { display:flex; gap:8px; }
.btn-sm {
  padding:8px 16px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--text); cursor:pointer;
  font-family:var(--font-mono); font-size:11px; transition:all 0.2s;
  display:flex; align-items:center; gap:6px;
}
.btn-sm:hover { border-color:var(--accent); color:var(--accent); }
.btn-sm.primary {
  background:var(--accent); color:var(--bg); border-color:var(--accent);
  font-weight:500;
}
.btn-sm.primary:hover { box-shadow:var(--glow); }
.btn-sm.fav-active { color:var(--accent2); border-color:var(--accent2); }

/* External camera fallback */
.preview-ext, .fs-ext {
  display:none; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  background:linear-gradient(135deg, #080c14 0%, #0c1420 50%, #080e18 100%);
}
.preview-ext { width:100%; aspect-ratio:16/9; }
.fs-ext { flex:1; width:100%; }
.preview-ext::before, .fs-ext::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 40%, rgba(0,240,255,0.06) 0%, transparent 60%);
  pointer-events:none;
}
.ext-pulse-ring {
  width:72px; height:72px; border-radius:50%; border:2px solid rgba(0,240,255,0.25);
  display:flex; align-items:center; justify-content:center;
  animation:extPulse 2.5s ease-in-out infinite; position:relative;
}
.fs-ext .ext-pulse-ring { width:100px; height:100px; }
@keyframes extPulse {
  0%,100% { box-shadow:0 0 0 0 rgba(0,240,255,0.15); }
  50% { box-shadow:0 0 0 18px rgba(0,240,255,0); }
}
.ext-pulse-ring .ext-icon { font-size:28px; filter:drop-shadow(0 0 8px rgba(0,240,255,0.5)); }
.fs-ext .ext-icon { font-size:40px; }
.ext-source-badge {
  margin-top:14px; font-size:10px; color:var(--accent); letter-spacing:3px;
  text-transform:uppercase; opacity:0.7; font-family:var(--font-mono);
}
.fs-ext .ext-source-badge { font-size:13px; margin-top:20px; }
.ext-desc { margin-top:4px; font-size:11px; color:var(--text-dim); }
.fs-ext .ext-desc { font-size:13px; margin-top:6px; }
.ext-watch-btn {
  margin-top:14px; padding:10px 24px; border-radius:8px;
  background:rgba(0,240,255,0.1); border:1px solid rgba(0,240,255,0.4);
  color:var(--accent); font-family:var(--font-mono); font-size:12px;
  cursor:pointer; text-decoration:none; display:inline-flex;
  align-items:center; gap:8px; transition:all 0.2s; position:relative; z-index:1;
}
.fs-ext .ext-watch-btn { font-size:14px; padding:14px 32px; margin-top:20px; }
.ext-watch-btn:hover {
  background:rgba(0,240,255,0.22); box-shadow:0 0 20px rgba(0,240,255,0.2);
  transform:translateY(-1px);
}
.ext-watch-btn .arrow { font-size:14px; }
#preview-close {
  position:absolute; top:12px; right:12px; width:32px; height:32px;
  border-radius:50%; border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.6); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px;
  transition:all 0.2s; z-index:5;
}
#preview-close:hover { border-color:var(--accent); color:var(--accent); }

/* ========== GRID / MOSAIC VIEW ========== */
#grid-view {
  position:fixed; inset:0; z-index:50; background:var(--bg);
  display:none; flex-direction:column; overflow:hidden;
}
#grid-view.open { display:flex; }

#grid-toolbar {
  display:flex; align-items:center; padding:12px 20px; gap:12px;
  border-bottom:1px solid var(--border); flex-shrink:0;
  background:var(--surface); backdrop-filter:blur(12px);
  margin-top:56px; flex-wrap:wrap;
}
#grid-search {
  flex:1; max-width:320px; padding:8px 14px; border-radius:8px;
  border:1px solid var(--border); background:rgba(255,255,255,0.03);
  color:var(--text); font-family:var(--font-mono); font-size:12px;
  outline:none; transition:border-color 0.2s;
}
#grid-search:focus { border-color:var(--accent); }
#grid-search::placeholder { color:var(--text-dim); }

.filter-btn {
  padding:6px 12px; border-radius:6px; border:1px solid var(--border);
  background:transparent; color:var(--text-dim); cursor:pointer;
  font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
  letter-spacing:1px; transition:all 0.2s; white-space:nowrap;
}
.filter-btn:hover, .filter-btn.active {
  border-color:var(--accent); color:var(--accent); background:rgba(0,240,255,0.05);
}
.filter-btn.fav-filter.active { border-color:var(--accent2); color:var(--accent2); }

.grid-cols-control {
  display:flex; align-items:center; gap:4px; margin-left:auto;
}
.grid-cols-control label { font-size:10px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }
.grid-cols-control input[type=range] {
  width:80px; accent-color:var(--accent); cursor:pointer;
}

#grid-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden; padding:16px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
#grid-scroll::-webkit-scrollbar { width:6px; }
#grid-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

#grid-cards {
  display:grid;
  grid-template-columns:repeat(var(--grid-cols), 1fr);
  gap:12px;
}
.grid-card {
  border-radius:12px; border:1px solid var(--border); overflow:hidden;
  background:var(--bg2); cursor:pointer; transition:all 0.25s;
  position:relative; group:true;
}
.grid-card:hover {
  border-color:var(--accent); transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(0,240,255,0.1);
}
.grid-card .card-thumb {
  width:100%; aspect-ratio:16/9; object-fit:cover; display:block;
  background:var(--bg3); transition:filter 0.3s;
}
.grid-card:hover .card-thumb { filter:brightness(1.1); }
.grid-card .card-info {
  padding:10px 12px; display:flex; align-items:center; justify-content:space-between;
}
.grid-card .card-name {
  font-family:var(--font-display); font-size:12px; font-weight:600;
  color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;
}
.grid-card .card-loc {
  font-size:9px; color:var(--text-dim); letter-spacing:0.5px; margin-top:2px;
}
.grid-card .card-actions {
  display:flex; gap:4px; opacity:0; transition:opacity 0.2s;
}
.grid-card:hover .card-actions { opacity:1; }
.card-btn {
  width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:12px;
  transition:all 0.2s;
}
.card-btn:hover { border-color:var(--accent); color:var(--accent); }
.card-btn.fav-active { color:var(--accent2); border-color:var(--accent2); }
.grid-card .live-dot {
  position:absolute; top:10px; left:10px;
  width:8px; height:8px; border-radius:50%; background:var(--accent3);
  box-shadow:0 0 8px var(--accent3);
  animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity:1; } 50% { opacity:0.4; }
}
.grid-card .card-continent {
  position:absolute; top:10px; right:10px; padding:2px 8px;
  border-radius:4px; background:rgba(0,0,0,0.6); font-size:9px;
  color:var(--text-dim); letter-spacing:1px; text-transform:uppercase;
  backdrop-filter:blur(4px);
}

/* ========== FULLSCREEN CAM VIEW ========== */
#fullscreen-cam {
  position:fixed; inset:0; z-index:400; background:#000;
  display:none; flex-direction:column;
}
#fullscreen-cam.open { display:flex; }
#fullscreen-cam .fs-topbar {
  position:absolute; top:0; left:0; right:0; z-index:5;
  padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
}
#fullscreen-cam .fs-info { display:flex; align-items:center; gap:12px; }
#fullscreen-cam .fs-name { font-family:var(--font-display); font-weight:600; font-size:18px; color:#fff; }
#fullscreen-cam .fs-loc { font-size:11px; color:var(--text-dim); }
#fullscreen-cam iframe {
  width:100%; height:100%; border:none; flex:1;
}

/* ========== SETTINGS PANEL ========== */
#settings-panel {
  position:fixed; top:0; right:-380px; bottom:0; width:360px; z-index:500;
  background:var(--bg2); border-left:1px solid var(--border);
  transition:right 0.3s ease; overflow-y:auto; padding:24px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
#settings-panel.open { right:0; }
#settings-overlay {
  position:fixed; inset:0; z-index:499; background:rgba(0,0,0,0.4);
  display:none; backdrop-filter:blur(2px);
}
#settings-overlay.open { display:block; }

.settings-title {
  font-family:var(--font-display); font-weight:800; font-size:20px;
  color:#fff; margin-bottom:24px; display:flex; align-items:center;
  justify-content:space-between;
}
.settings-section {
  margin-bottom:24px;
}
.settings-section h3 {
  font-size:10px; letter-spacing:2px; text-transform:uppercase;
  color:var(--accent); margin-bottom:12px; font-weight:500;
}
.setting-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.04);
}
.setting-row label {
  font-size:12px; color:var(--text); font-weight:300;
}
.setting-row input[type=range] {
  width:120px; accent-color:var(--accent); cursor:pointer;
}
.setting-row input[type=checkbox] {
  accent-color:var(--accent); cursor:pointer; width:16px; height:16px;
}
.setting-row select {
  padding:4px 8px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg3); color:var(--text); font-family:var(--font-mono);
  font-size:11px; cursor:pointer; outline:none;
}
.setting-row .val {
  font-size:11px; color:var(--text-dim); min-width:32px; text-align:right;
}

/* ========== SAVED VIEWS ========== */
#views-panel {
  position:fixed; bottom:80px; right:20px; z-index:150;
  width:280px; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; backdrop-filter:blur(12px);
  display:none; overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}
#views-panel.open { display:block; animation:slideUp 0.2s ease-out; }
.views-header {
  padding:12px 16px; border-bottom:1px solid var(--border);
  font-family:var(--font-display); font-weight:600; font-size:13px;
  display:flex; align-items:center; justify-content:space-between;
}
.views-list { max-height:240px; overflow-y:auto; }
.view-item {
  padding:10px 16px; cursor:pointer; transition:background 0.15s;
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; border-bottom:1px solid rgba(255,255,255,0.03);
}
.view-item:hover { background:rgba(0,240,255,0.05); }
.view-item .view-count { font-size:10px; color:var(--text-dim); }
.view-item .view-del {
  opacity:0; cursor:pointer; color:var(--text-dim); font-size:14px;
  transition:all 0.15s; background:none; border:none;
}
.view-item:hover .view-del { opacity:1; }
.view-item .view-del:hover { color:var(--accent2); }
.views-add {
  padding:10px 16px; display:flex; gap:8px;
  border-top:1px solid var(--border);
}
.views-add input {
  flex:1; padding:6px 10px; border-radius:6px; border:1px solid var(--border);
  background:rgba(255,255,255,0.03); color:var(--text);
  font-family:var(--font-mono); font-size:11px; outline:none;
}
.views-add input:focus { border-color:var(--accent); }
.views-add button {
  padding:6px 12px; border-radius:6px; border:1px solid var(--accent);
  background:rgba(0,240,255,0.1); color:var(--accent);
  font-family:var(--font-mono); font-size:11px; cursor:pointer;
  transition:all 0.2s;
}
.views-add button:hover { background:var(--accent); color:var(--bg); }

/* ========== ADD TO VIEW DROPDOWN ========== */
.add-to-view-menu {
  position:fixed; z-index:600; width:200px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; backdrop-filter:blur(12px); overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.4); display:none;
}
.add-to-view-menu.open { display:block; animation:fadeIn 0.15s; }
.add-to-view-menu .avm-item {
  padding:8px 14px; cursor:pointer; font-size:11px;
  transition:background 0.15s; display:flex; align-items:center; gap:8px;
}
.add-to-view-menu .avm-item:hover { background:rgba(0,240,255,0.08); color:var(--accent); }
.add-to-view-menu .avm-item .check { color:var(--accent3); font-size:13px; }

/* ========== CONTINENT FILTERS (GLOBE) ========== */
#continent-filters {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:90; display:flex; gap:6px;
  padding:6px 10px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border);
  backdrop-filter:blur(12px);
}

/* ========== CAM COUNT INDICATOR ========== */
#cam-count {
  position:fixed; bottom:20px; right:20px; z-index:90;
  padding:6px 14px; border-radius:8px;
  background:var(--surface); border:1px solid var(--border);
  backdrop-filter:blur(12px);
  font-size:10px; color:var(--text-dim); letter-spacing:1px;
  text-transform:uppercase;
}
#cam-count span { color:var(--accent); font-weight:500; }

/* ========== ROTATION PLAY/PAUSE ========== */
#rotation-toggle {
  position:fixed; bottom:20px; left:20px; z-index:90;
  width:44px; height:44px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border);
  backdrop-filter:blur(12px); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; cursor:pointer; transition:all 0.2s;
}
#rotation-toggle:hover { border-color:var(--accent); color:var(--accent); box-shadow:var(--glow); }
#rotation-toggle.paused { color:var(--text-dim); }

/* ========== LOADING ========== */
#loading {
  position:fixed; inset:0; z-index:9999; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.5s;
}
#loading.done { opacity:0; pointer-events:none; }
#loading .loader-ring {
  width:60px; height:60px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
#loading .loader-text {
  margin-top:16px; font-size:11px; letter-spacing:3px;
  text-transform:uppercase; color:var(--text-dim);
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ========== RESPONSIVE ========== */
@media (max-width:768px) {
  :root { --grid-cols:2; }
  #settings-panel { width:100%; right:-100%; }
  #preview-card { width:95vw; }
  #logo .sub { display:none; }
  .filter-btn { font-size:9px; padding:4px 8px; }
}
@media (max-width:480px) {
  :root { --grid-cols:1; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">Initializing aEye</div>
</div>

<!-- TOOLTIP -->
<div id="tooltip"><span class="tt-name"></span><div class="tt-city"></div></div>

<!-- TOP BAR -->
<div id="topbar">
  <div id="logo">
    <span class="eye">◉</span> aEye
    <span class="sub">Global Camera Network</span>
  </div>
  <div class="topbar-controls">
    <button class="btn-icon" id="btn-search-globe" title="Search (/)">🔍</button>
    <button class="btn-icon" id="btn-views" title="Saved Views (V)">📋</button>
    <button class="btn-icon" id="btn-toggle-view" title="Toggle View (G)">⊞</button>
    <button class="btn-icon" id="btn-settings" title="Settings (S)">⚙</button>
    <button class="btn-icon" id="btn-fullscreen" title="Fullscreen (F)">⛶</button>
  </div>
</div>

<!-- GLOBE -->
<div id="globe-container"></div>

<!-- CONTINENT FILTERS -->
<div id="continent-filters"></div>
<div id="cam-count"><span id="cam-count-num">0</span> cameras online</div>
<button id="rotation-toggle" title="Pause/Resume rotation (Space)">⏸</button>

<!-- PREVIEW POPUP -->
<div id="preview-overlay">
  <div id="preview-card">
    <button id="preview-close">✕</button>
    <img class="preview-img" id="preview-img" alt="Camera preview">
    <iframe class="preview-video" id="preview-video" allow="autoplay; encrypted-media; fullscreen"></iframe>
    <div class="preview-ext" id="preview-ext">
      <div class="ext-pulse-ring"><span class="ext-icon">📡</span></div>
      <div class="ext-source-badge" id="preview-ext-source">WEBCAMTAXI</div>
      <div class="ext-desc">External camera stream</div>
      <a class="ext-watch-btn" id="preview-ext-link" href="#" target="_blank" rel="noopener">Watch Live <span class="arrow">↗</span></a>
    </div>
    <div class="preview-info">
      <div class="left">
        <div class="cam-name" id="preview-name"></div>
        <div class="cam-loc" id="preview-loc"></div>
      </div>
      <div class="preview-actions">
        <button class="btn-sm" id="btn-preview-fav" title="Favorite">♡ Fav</button>
        <button class="btn-sm" id="btn-preview-addview" title="Add to View">+ View</button>
        <button class="btn-sm primary" id="btn-preview-watch">▶ Watch</button>
      </div>
    </div>
  </div>
</div>

<!-- GRID VIEW -->
<div id="grid-view">
  <div id="grid-toolbar">
    <input type="text" id="grid-search" placeholder="Search cameras...">
    <button class="filter-btn active" data-continent="all">All</button>
    <button class="filter-btn" data-continent="NA">Americas</button>
    <button class="filter-btn" data-continent="EU">Europe</button>
    <button class="filter-btn" data-continent="AS">Asia</button>
    <button class="filter-btn" data-continent="AF">Africa/ME</button>
    <button class="filter-btn" data-continent="OC">Oceania</button>
    <button class="filter-btn fav-filter" data-continent="fav">♡ Favs</button>
    <div class="grid-cols-control">
      <label>Grid</label>
      <input type="range" id="grid-cols-slider" min="1" max="6" value="4" step="1">
    </div>
  </div>
  <div id="grid-scroll">
    <div id="grid-cards"></div>
  </div>
</div>

<!-- FULLSCREEN CAM -->
<div id="fullscreen-cam">
  <div class="fs-topbar">
    <div class="fs-info">
      <button class="btn-icon" id="btn-fs-back" title="Back (ESC)">←</button>
      <div>
        <div class="fs-name" id="fs-name"></div>
        <div class="fs-loc" id="fs-loc"></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-icon" id="btn-fs-fav" title="Favorite">♡</button>
      <button class="btn-icon" id="btn-fs-open" title="Open in new tab">↗</button>
    </div>
  </div>
  <iframe id="fs-iframe" allow="autoplay; encrypted-media; fullscreen"></iframe>
  <div class="fs-ext" id="fs-ext">
    <div class="ext-pulse-ring"><span class="ext-icon">📡</span></div>
    <div class="ext-source-badge" id="fs-ext-source">WEBCAMTAXI</div>
    <div class="ext-desc">External camera stream</div>
    <a class="ext-watch-btn" id="fs-ext-link" href="#" target="_blank" rel="noopener">Watch Live <span class="arrow">↗</span></a>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-overlay"></div>
<div id="settings-panel">
  <div class="settings-title">
    Settings
    <button class="btn-icon" id="btn-settings-close" style="width:32px;height:32px;font-size:14px;">✕</button>
  </div>

  <div class="settings-section">
    <h3>Globe</h3>
    <div class="setting-row">
      <label>Rotation Speed</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="range" id="set-rotation" min="0" max="1" step="0.05" value="0.15">
        <span class="val" id="val-rotation">0.15</span>
      </div>
    </div>
    <div class="setting-row">
      <label>Pin Size</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="range" id="set-pin-size" min="0.1" max="1.5" step="0.05" value="0.45">
        <span class="val" id="val-pin-size">0.45</span>
      </div>
    </div>
    <div class="setting-row">
      <label>Atmosphere</label>
      <input type="checkbox" id="set-atmosphere" checked>
    </div>
    <div class="setting-row">
      <label>Country Fill</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="range" id="set-country-fill" min="0" max="0.3" step="0.01" value="0.06">
        <span class="val" id="val-country-fill">0.06</span>
      </div>
    </div>
    <div class="setting-row">
      <label>Auto-Rotate</label>
      <input type="checkbox" id="set-auto-rotate" checked>
    </div>
  </div>

  <div class="settings-section">
    <h3>Grid</h3>
    <div class="setting-row">
      <label>Default Columns</label>
      <select id="set-grid-cols">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
  </div>

  <div class="settings-section">
    <h3>Theme</h3>
    <div class="setting-row">
      <label>Accent Color</label>
      <select id="set-accent">
        <option value="#00f0ff">Cyan</option>
        <option value="#39ff14">Neon Green</option>
        <option value="#ff006e">Hot Pink</option>
        <option value="#ff9500">Orange</option>
        <option value="#a855f7">Purple</option>
        <option value="#facc15">Gold</option>
      </select>
    </div>
  </div>

  <div class="settings-section">
    <h3>Data</h3>
    <div class="setting-row">
      <label>Total Cameras</label>
      <span class="val" id="val-total-cams">0</span>
    </div>
    <div class="setting-row">
      <label>Favorites</label>
      <span class="val" id="val-total-favs">0</span>
    </div>
    <div class="setting-row">
      <label>Saved Views</label>
      <span class="val" id="val-total-views">0</span>
    </div>
  </div>
</div>

</div>

function saveFavs() { localStorage.setItem('aeye-favs', JSON.stringify(favorites)); updateStats(); }

function isFav(id) { return favorites.includes(id); }
function toggleFav(id) {
  if (isFav(id)) favorites = favorites.filter(f=>f!==id);
  else favorites.push(id);
  saveFavs();
}

function updateStats() {
  document.getElementById('val-total-cams').textContent = CAMERAS.length;

  document.getElementById('val-total-views').textContent = Object.keys(savedViews).length;

  const badge = document.querySelector('#btn-views .badge');
  if (badge) badge.remove();
  if (favorites.length > 0) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = favorites.length;
    document.getElementById('btn-views').appendChild(b);
  }
}

// ================================================================
//  GLOBE INITIALIZATION
// ================================================================
function initGlobe() {
  const container = document.getElementById('globe-container');

  globe = Globe()(container)
    .globeImageUrl('')
    .backgroundColor('rgba(0,0,0,0)')
    .showGlobe(true)
    .showAtmosphere(settings.atmosphere)
    .atmosphereColor(settings.accent)
    .atmosphereAltitude(0.2)
    .pointsData(getFilteredCameras())
    .pointLat(d => d.lat)
    .pointLng(d => d.lng)
    .pointAltitude(0.01)
    .pointRadius(d => settings.pinSize * (isFav(d.id) ? 1.3 : 1))
    .pointColor(d => isFav(d.id) ? '#ff006e' : settings.accent)
    .pointsMerge(false)
    .pointLabel('')
    .onPointHover(handlePointHover)
    .onPointClick(handlePointClick);

  // Custom globe material — dark with visible borders
  const globeMaterial = globe.globeMaterial();
  globeMaterial.color.set(0x080c14);
  globeMaterial.emissive.set(0x040610);
  globeMaterial.emissiveIntensity = 0.4;
  globeMaterial.shininess = 0.3;

  // Auto rotation
  if (settings.autoRotate) {
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = settings.rotationSpeed;
  }
  globe.controls().enableDamping = true;
  globe.controls().dampingFactor = 0.1;
  globe.controls().minDistance = 120;
  globe.controls().maxDistance = 600;

  // Pause rotation on manual interaction; play/pause button reflects state.
  const rotBtn = document.getElementById('rotation-toggle');
  const setRotation = (on) => {
    if (!globe || !globe.controls()) return;
    globe.controls().autoRotate = on;
    rotBtn.textContent = on ? '⏸' : '▶';
    rotBtn.classList.toggle('paused', !on);
    rotBtn.title = (on ? 'Pause' : 'Resume') + ' rotation (Space)';
  };
  window.setRotation = setRotation;
  setRotation(!!settings.autoRotate);
  // User drag / zoom / wheel → pause
  const pauseOnInteract = () => setRotation(false);
  globe.controls().addEventListener('start', pauseOnInteract);
  rotBtn.addEventListener('click', () => setRotation(!globe.controls().autoRotate));
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
      e.preventDefault();
      setRotation(!globe.controls().autoRotate);
    }
  });

  // Load country polygons
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(data => {
      const countries = topojson.feature(data, data.objects.countries).features;
      globe
        .polygonsData(countries)
        .polygonCapColor(() => `rgba(8,16,30,${settings.countryFill})`)
        .polygonSideColor(() => 'rgba(0,0,0,0)')
        .polygonStrokeColor(() => hexToRGBA(settings.accent, 0.25))
        .polygonAltitude(0.005);

      // Signal load complete
      setTimeout(() => {
        document.getElementById('loading').classList.add('done');
        setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
      }, 800);
    });

  // Scene enhancements — add subtle stars
  const scene = globe.scene();
  addStars(scene);

  // Custom point animation — pulsing glow
  requestAnimationFrame(function animate() {
    requestAnimationFrame(animate);
  });

  // Window resize
  window.addEventListener('resize', () => globe.width(window.innerWidth).height(window.innerHeight));

  // Initial cam count
  document.getElementById('cam-count-num').textContent = CAMERAS.length;
}

function addStars(scene) {
  const THREE = globe.scene().constructor.__proto__.constructor; // hack to access Three
  // Manual star geometry
  const starCount = 1500;
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 800 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
  }

  const canvas = document.createElement('canvas');
  canvas.width = 32; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(16,16,0,16,16,16);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.3, 'rgba(200,220,255,0.3)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,32,32);

  // Use raw Three.js from globe internals
  try {
    const geo = new window.THREE.BufferGeometry();
    geo.setAttribute('position', new window.THREE.Float32BufferAttribute(positions, 3));
    const mat = new window.THREE.PointsMaterial({
      size: 1.5, color: 0xaabbdd, transparent: true, opacity: 0.6, sizeAttenuation: true
    });
    const stars = new window.THREE.Points(geo, mat);
    scene.add(stars);
  } catch(e) {
    // Three.js access method varies; silently fail for stars (non-essential)
  }
}

function getFilteredCameras() {

// Embed a YouTube video with graceful fallback if the iframe refuses to play.
// Two detection paths:
//   1) IFrame Player API onError via postMessage (fires for codes 2/5/100/101/150)
//   2) Time-based: if no onReady event within 6s, assume "Video unavailable"
//      static page was rendered (YouTube's embed-disabled screen does NOT
//      dispatch JS events), and swap to a verified worldwide fallback.
const YT_FALLBACK_ID = 'HfgIFGbdGJ0';  // earthTV World Live (verified embeddable)
function loadYouTubeEmbed(iframe, src, cam) {
  const url = new URL(src);
  url.searchParams.set('enablejsapi', '1');
  url.searchParams.set('origin', location.origin);
  const primaryId = cam && cam.youtubeId;
  let fallbackTriggered = false;
  let readyReceived = false;
  iframe.src = url.toString();
  iframe.dataset.ytPrimary = primaryId || '';

  const swapToFallback = (reason) => {
    if (fallbackTriggered) return;
    fallbackTriggered = true;
    console.warn('[aEye] YouTube embed failed (' + reason + ') for', primaryId, '→ fallback', YT_FALLBACK_ID);
    if (primaryId === YT_FALLBACK_ID) return;  // avoid loop
    const fb = new URL('https://www.youtube-nocookie.com/embed/' + YT_FALLBACK_ID);
    fb.searchParams.set('autoplay', '1');
    fb.searchParams.set('mute', '1');
    fb.searchParams.set('playsinline', '1');
    fb.searchParams.set('enablejsapi', '1');
    fb.searchParams.set('origin', location.origin);
    iframe.src = fb.toString();
  };

  const handler = (ev) => {
    if (ev.source !== iframe.contentWindow) return;
    let d; try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch { return; }
    if (!d) return;
    if (d.event === 'onReady' || d.event === 'initialDelivery') readyReceived = true;
    if (d.event === 'onError') {
      // Codes 101/150 = embed disabled by owner, 100 = removed/private, 2/5 = other
      swapToFallback('onError:' + d.info);
    }
  };
  if (iframe._ytErrHandler) window.removeEventListener('message', iframe._ytErrHandler);
  iframe._ytErrHandler = handler;
  window.addEventListener('message', handler);

  // Kick the IFrame API by posting a listening request once the iframe loads
  iframe.onload = () => {
    try {
      iframe.contentWindow.postMessage(JSON.stringify({event:'listening', id:primaryId||''}), '*');
    } catch (e) {}
  };

  // Time-based fallback for embed-disabled static page (no JS events fire there)
  if (iframe._ytTimeout) clearTimeout(iframe._ytTimeout);
  iframe._ytTimeout = setTimeout(() => {
    if (!readyReceived) swapToFallback('timeout');
  }, 6500);
}

function watchCamera(cam) {
  if (!cam) return;
  isWatching = true;
  const img = document.getElementById('preview-img');
  const video = document.getElementById('preview-video');
  const ext = document.getElementById('preview-ext');

  if (cam.embed && cam.embed.includes('/embed/')) {
    // YouTube - embed inline
    img.style.display = 'none';
    video.style.display = 'block';
    ext.style.display = 'none';
    let src = cam.embed;
    if (!src.includes('autoplay')) {
      src += (src.includes('?') ? '&' : '?') + 'autoplay=1&mute=1';
    }
    loadYouTubeEmbed(video, src, cam);
  } else if (cam.embed) {
    // External camera - show external card
    img.style.display = 'none';
    video.style.display = 'none';
    ext.style.display = 'flex';
    const source = cam.embed.includes('webcamtaxi') ? 'WEBCAMTAXI' :
                   cam.embed.includes('skylinewebcams') ? 'SKYLINEWEBCAMS' : 'EXTERNAL STREAM';
    document.getElementById('preview-ext-source').textContent = source;
    document.getElementById('preview-ext-link').href = cam.embed;
  } else {
    window.open(`https://www.google.com/search?q=${encodeURIComponent(cam.name + ' live camera')}`, '_blank');
  }
}

function openFullscreenCam(cam) {
  const el = document.getElementById('fullscreen-cam');
  document.getElementById('fs-name').textContent = cam.name;

      src += (src.includes('?') ? '&' : '?') + 'autoplay=1&mute=1';

    loadYouTubeEmbed(fsIframe, src, cam);
  } else {
    fsIframe.style.display = 'none';
    fsExt.style.display = 'flex';

                   cam.embed.includes('skylinewebcams') ? 'SKYLINEWEBCAMS' : 'EXTERNAL STREAM';

    document.getElementById('fs-ext-link').href = cam.embed;

    refreshGlobePins();
  };

  el.classList.add('open');
}

function getGridCameras() {
  let cams = [...CAMERAS];
  const search = document.getElementById('grid-search').value.toLowerCase().trim();
  const activeFilter = document.querySelector('#grid-toolbar .filter-btn.active');
  const filter = activeFilter ? activeFilter.dataset.continent : 'all';

  if (filter === 'fav') {
    cams = cams.filter(c => isFav(c.id));
  } else if (filter !== 'all') {
    cams = cams.filter(c => c.continent === filter);
  }
  if (search) {
    cams = cams.filter(c =>
      c.name.toLowerCase().includes(search) ||
      c.city.toLowerCase().includes(search) ||
      c.country.toLowerCase().includes(search) ||
      c.tags.some(t => t.includes(search))
    );
  }
  return cams;
}

const FALLBACK_THUMB = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" fill="%23121824"><rect width="320" height="180"/><text x="160" y="90" text-anchor="middle" fill="%235a6a7a" font-family="monospace" font-size="12">No Preview</text></svg>');

function renderGrid() {
  const container = document.getElementById('grid-cards');
  const cams = getGridCameras();
  container.innerHTML = '';

  if (cams.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-dim);font-size:13px;">No cameras found</div>';
    return;
  }

  cams.forEach(cam => {
    const card = document.createElement('div');
    card.className = 'grid-card';
    const thumb = document.createElement('img');
    thumb.className = 'card-thumb';
    thumb.src = cam.thumbnailUrl;
    thumb.alt = cam.name;
    thumb.loading = 'lazy';
    thumb.onerror = function() { this.src = FALLBACK_THUMB; };

    card.innerHTML = `
      <div class="live-dot"></div>
      <div class="card-continent">${cam.continent}</div>
      <div class="card-info">
        <div>
          <div class="card-name">${cam.name}</div>
          <div class="card-loc">${cam.city}, ${cam.country}</div>
        </div>
        <div class="card-actions">
          <button class="card-btn fav-btn ${isFav(cam.id)?'fav-active':''}" data-id="${cam.id}" title="Favorite">${isFav(cam.id)?'♥':'♡'}</button>
          <button class="card-btn view-btn" data-id="${cam.id}" title="Add to View">+</button>
        </div>
      </div>
    `;
    // Insert thumb after live-dot
    card.insertBefore(thumb, card.querySelector('.card-info'));

    // Click card thumb → fullscreen cam
    card.querySelector('.card-thumb').addEventListener('click', () => openFullscreenCam(cam));
    card.querySelector('.card-name').addEventListener('click', () => openFullscreenCam(cam));

    // Fav button
    card.querySelector('.fav-btn').addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(cam.id);
      renderGrid();
      refreshGlobePins();
    });

    // Add to view button
    card.querySelector('.view-btn').addEventListener('click', e => {
      e.stopPropagation();
      showAddToViewMenu(cam.id, e.target);
    });

    container.appendChild(card);
  });
}

function renderViewsList() {
  const list = document.getElementById('views-list');
  const keys = Object.keys(savedViews);
  if (keys.length === 0) {
    list.innerHTML = '<div style="padding:16px;text-align:center;font-size:11px;color:var(--text-dim);">No saved views yet</div>';
    return;
  }
  list.innerHTML = '';
  keys.forEach(name => {
    const item = document.createElement('div');
    item.className = 'view-item';
    item.innerHTML = `
      <span>${name}</span>
      <span class="view-count">${savedViews[name].length} cams</span>
      <button class="view-del" data-name="${name}">✕</button>
    `;
    item.addEventListener('click', () => loadView(name));
    item.querySelector('.view-del').addEventListener('click', e => {
      e.stopPropagation();
      delete savedViews[name];
      saveViews();
      renderViewsList();
    });
    list.appendChild(item);
  });
}

function loadView(name) {
  if (!savedViews[name]) return;
  // Switch to grid view filtered to this view's cameras
  if (currentView === 'globe') toggleView();
  // Set search to empty, filter to all
  document.getElementById('grid-search').value = '';
  document.querySelectorAll('#grid-toolbar .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('#grid-toolbar .filter-btn[data-continent="all"]').classList.add('active');

  // Render only view cameras
  const container = document.getElementById('grid-cards');
  const camIds = savedViews[name];
  const cams = CAMERAS.filter(c => camIds.includes(c.id));
  container.innerHTML = '';
  if (cams.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-dim);font-size:13px;">Empty view</div>';
    return;
  }
  cams.forEach(cam => {
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.innerHTML = `
      <div class="live-dot"></div>
      <div class="card-continent">${cam.continent}</div>
      <img class="card-thumb" src="${cam.thumbnailUrl}" alt="${cam.name}" loading="lazy">
      <div class="card-info">
        <div>
          <div class="card-name">${cam.name}</div>
          <div class="card-loc">${cam.city}, ${cam.country}</div>
        </div>
        <div class="card-actions">
          <button class="card-btn fav-btn ${isFav(cam.id)?'fav-active':''}" data-id="${cam.id}">${isFav(cam.id)?'♥':'♡'}</button>
        </div>
      </div>
    `;
    card.querySelector('.card-thumb').addEventListener('click', () => openFullscreenCam(cam));
    card.querySelector('.card-name').addEventListener('click', () => openFullscreenCam(cam));
    card.querySelector('.fav-btn').addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(cam.id);
      refreshGlobePins();
    });
    container.appendChild(card);
  });

  // Close views panel
  document.getElementById('views-panel').classList.remove('open');
}

// Add-to-view context menu
function showAddToViewMenu(camId, anchor) {
  const menu = document.getElementById('add-to-view-menu');
  const rect = anchor.getBoundingClientRect();
  const viewNames = Object.keys(savedViews);

  if (viewNames.length === 0) {
    menu.innerHTML = '<div class="avm-item" style="color:var(--text-dim);">No views. Create one first.</div>';
  } else {
    menu.innerHTML = viewNames.map(name => {
      const inView = savedViews[name].includes(camId);
      return `<div class="avm-item" data-view="${name}" data-cam="${camId}">
        ${inView ? '<span class="check">✓</span>' : '<span style="width:13px;display:inline-block;"></span>'}
        ${name}
      </div>`;
    }).join('');

    menu.querySelectorAll('.avm-item').forEach(item => {
      item.addEventListener('click', () => {
        const vName = item.dataset.view;
        const cId = item.dataset.cam;
        if (savedViews[vName].includes(cId)) {
          savedViews[vName] = savedViews[vName].filter(x => x !== cId);
        } else {
          savedViews[vName].push(cId);
        }
        saveViews();
        showAddToViewMenu(camId, anchor); // Re-render
      });
    });
  }

  menu.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.classList.add('open');

  const close = (e) => {
    if (!menu.contains(e.target) && e.target !== anchor) {
      menu.classList.remove('open');
      document.removeEventListener('click', close);
    }
  };
  setTimeout(() => document.addEventListener('click', close), 10);
}

function applySettings() {
  // Rotation
  const rot = document.getElementById('set-rotation');
  settings.rotationSpeed = parseFloat(rot.value);
  document.getElementById('val-rotation').textContent = rot.value;
  if (globe && globe.controls()) globe.controls().autoRotateSpeed = settings.rotationSpeed;

  // Pin size
  const pin = document.getElementById('set-pin-size');
  settings.pinSize = parseFloat(pin.value);
  document.getElementById('val-pin-size').textContent = pin.value;
  refreshGlobePins();

  // Atmosphere
  settings.atmosphere = document.getElementById('set-atmosphere').checked;
  if (globe) globe.showAtmosphere(settings.atmosphere);

  // Country fill
  const fill = document.getElementById('set-country-fill');
  settings.countryFill = parseFloat(fill.value);
  document.getElementById('val-country-fill').textContent = fill.value;
  if (globe) globe.polygonCapColor(() => `rgba(8,16,30,${settings.countryFill})`);

  // Auto-rotate
  settings.autoRotate = document.getElementById('set-auto-rotate').checked;
  if (window.setRotation) window.setRotation(settings.autoRotate);

  // Grid cols
  settings.gridCols = parseInt(document.getElementById('set-grid-cols').value);
  document.documentElement.style.setProperty('--grid-cols', settings.gridCols);
  document.getElementById('grid-cols-slider').value = settings.gridCols;

  // Accent
  const accent = document.getElementById('set-accent').value;
  settings.accent = accent;
  document.documentElement.style.setProperty('--accent', accent);
  if (globe) {
    globe.atmosphereColor(accent);
    globe.polygonStrokeColor(() => hexToRGBA(accent, 0.25));
    refreshGlobePins();
  }

  saveSettings();
}

  document.getElementById('set-pin-size').value = settings.pinSize;
  document.getElementById('val-pin-size').textContent = settings.pinSize;
  document.getElementById('set-atmosphere').checked = settings.atmosphere;
  document.getElementById('set-country-fill').value = settings.countryFill;
  document.getElementById('val-country-fill').textContent = settings.countryFill;
  document.getElementById('set-auto-rotate').checked = settings.autoRotate;
  document.getElementById('set-grid-cols').value = settings.gridCols;
  document.getElementById('set-accent').value = settings.accent;
  document.documentElement.style.setProperty('--accent', settings.accent);
  document.documentElement.style.setProperty('--grid-cols', settings.gridCols);
  document.getElementById('grid-cols-slider').value = settings.gridCols;
}

// ================================================================
//  FULLSCREEN
// ================================================================
document.getElementById('btn-fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
});

// ================================================================
//  GLOBE SEARCH
// ================================================================
const globeSearchBox = document.getElementById('globe-search-box');
const globeSearchInput = document.getElementById('globe-search-input');
const globeSearchResults = document.getElementById('globe-search-results');

document.getElementById('btn-search-globe').addEventListener('click', () => {
  const visible = globeSearchBox.style.display === 'block';
  globeSearchBox.style.display = visible ? 'none' : 'block';
  if (!visible) globeSearchInput.focus();
});

globeSearchInput.addEventListener('input', () => {
  const q = globeSearchInput.value.toLowerCase().trim();
  if (!q) { globeSearchResults.style.display = 'none'; return; }
  const matches = CAMERAS.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.city.toLowerCase().includes(q) ||
    c.country.toLowerCase().includes(q)
  ).slice(0, 8);

  if (matches.length === 0) {
    globeSearchResults.style.display = 'none'; return;
  }
  globeSearchResults.style.display = 'block';
  globeSearchResults.innerHTML = matches.map(c => `
    <div class="avm-item" data-id="${c.id}" style="cursor:pointer;">
      <span style="color:var(--accent);">◉</span>
      <span>${c.name} <span style="color:var(--text-dim);font-size:10px;">${c.city}, ${c.country}</span></span>
    </div>
  `).join('');
  globeSearchResults.querySelectorAll('.avm-item').forEach(item => {
    item.addEventListener('click', () => {
      const cam = CAMERAS.find(c => c.id === item.dataset.id);
      if (cam && globe) {
        globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 1.5 }, 1000);
        setTimeout(() => openPreview(cam), 1100);
      }
      globeSearchBox.style.display = 'none';
      globeSearchInput.value = '';
      globeSearchResults.style.display = 'none';
    });
  });
});

// ================================================================
//  KEYBOARD SHORTCUTS
// ================================================================
document.addEventListener('keydown', e => {
  // Don't trigger if typing in input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') {
      e.target.blur();
      globeSearchBox.style.display = 'none';
    }
    return;
  }

  switch(e.key.toLowerCase()) {
    case 'escape':
      if (document.getElementById('fullscreen-cam').classList.contains('open')) closeFullscreenCam();
      else if (document.getElementById('preview-overlay').classList.contains('open')) closePreview();
      else if (document.getElementById('settings-panel').classList.contains('open')) closeSettings();
      break;
    case 'g':
      toggleView();
      break;
    case 's':
      if (document.getElementById('settings-panel').classList.contains('open')) closeSettings();
      else openSettings();
      break;
    case 'f':
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      break;
    case '/':
      e.preventDefault();
      if (currentView === 'globe') {
        globeSearchBox.style.display = 'block';
        globeSearchInput.focus();
      } else {
        document.getElementById('grid-search').focus();
      }
      break;
    case 'v':
      document.getElementById('views-panel').classList.toggle('open');
      renderViewsList();
      break;
  }
});

// ================================================================
//  UTILS
// ================================================================
function hexToRGBA(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ================================================================
//  INIT
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  loadSettingsToUI();
  buildContinentFilters();
  updateStats();
  initGlobe();
});
</script>
