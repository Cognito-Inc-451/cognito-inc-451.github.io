<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAIV — AI Television</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;500;700;900&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
    --void: #020408;
    --deep: #060c18;
    --surface: #0c1424;
    --elevated: #12203a;
    --hover: #182a48;
    --cyan: #00ffe5;
    --magenta: #ff2a7f;
    --green: #00ff6a;
    --amber: #ffc800;
    --purple: #b84dff;
    --red: #ff2244;
    --text-bright: #eef2ff;
    --text-primary: #b0bcd8;
    --text-secondary: #6878a0;
    --text-muted: #3a4868;
    --text-dim: #222e48;
    --border: #1a2444;
    --border-bright: #253060;
    --glow-cyan: rgba(0,255,229,0.5);
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--font-mono); color: var(--text-primary); }

/* ═══ CRT OVERLAY ═══ */
#crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 10000;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    mix-blend-mode: multiply;
}
#crt-overlay::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 4px; }

/* ═══ PHASE: TUNING ═══ */
#phase-tuning {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--void);
    background-image:
        radial-gradient(ellipse at 30% 40%, rgba(0,255,229,0.015) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(184,77,255,0.015) 0%, transparent 55%);
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
    overflow-y: auto;
}
#phase-tuning.hidden { opacity: 0; transform: scale(1.02); pointer-events: none; }

.tuning-logo {
    font-family: var(--font-display); font-size: clamp(40px, 8vw, 80px); font-weight: 900;
    letter-spacing: 0.4em; color: var(--cyan);
    text-shadow: 0 0 25px var(--glow-cyan), 0 0 80px rgba(0,255,229,0.12);
    margin-bottom: 6px; user-select: none;
}
.tuning-sub {
    font-family: var(--font-display); font-size: clamp(8px, 1.2vw, 11px);
    letter-spacing: 0.7em; text-transform: uppercase; color: var(--text-secondary);
    margin-bottom: 44px;
}
.tuning-prompt { position: relative; width: min(600px, 88vw); }
.tuning-input {
    width: 100%; background: var(--deep); border: 1px solid var(--border-bright);
    border-radius: 14px; padding: 18px 60px 18px 20px;
    font-family: var(--font-mono); font-size: 15px; color: var(--text-bright);
    outline: none; transition: border-color 0.3s, box-shadow 0.3s;
}
.tuning-input::placeholder { color: var(--text-muted); }
.tuning-input:focus {
    border-color: rgba(0,255,229,0.5);
    box-shadow: 0 0 0 1px rgba(0,255,229,0.15), 0 0 30px rgba(0,255,229,0.06);
}
.tuning-go {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--cyan), var(--green));
    color: var(--void); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; box-shadow: 0 0 16px rgba(0,255,229,0.2);
}
.tuning-go:hover { transform: translateY(-50%) scale(1.06); box-shadow: 0 0 28px rgba(0,255,229,0.35); }
.tuning-go:disabled { opacity: 0.3; cursor: default; transform: translateY(-50%); box-shadow: none; }
.tuning-go svg { width: 18px; height: 18px; }

.model-bar {
    display: flex; align-items: center; gap: 12px; margin-top: 28px;
    padding: 10px 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; font-size: 11px; color: var(--text-secondary); min-width: 300px;
    flex-wrap: wrap; justify-content: center;
}
.model-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0;
    transition: all 0.4s;
}
.model-dot.loading { background: var(--cyan); box-shadow: 0 0 8px var(--glow-cyan); animation: dotPulse 1.5s ease-in-out infinite; }
.model-dot.ready { background: var(--green); box-shadow: 0 0 8px rgba(0,255,106,0.4); }
.model-dot.error { background: var(--red); box-shadow: 0 0 8px rgba(255,34,68,0.4); }
@keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);} }
.model-text { flex: 1; font-family: var(--font-mono); font-size: 11px; min-width: 80px; }
.model-progress-bar { width: 100px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
.model-progress-fill { height: 100%; width: 0%; background: var(--cyan); border-radius: 2px; transition: width 0.3s; box-shadow: 0 0 6px var(--glow-cyan); }

.device-toggle {
    display: flex; gap: 2px; background: var(--border); border-radius: 6px; padding: 2px; flex-shrink: 0;
}
.device-opt {
    font-family: var(--font-mono); font-size: 9px; padding: 3px 8px;
    border: none; border-radius: 4px; background: transparent;
    color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.05em;
}
.device-opt.active { background: var(--elevated); color: var(--cyan); }
.device-opt:hover:not(.active) { color: var(--text-secondary); }

/* ═══ SETTINGS PANEL ═══ */
.settings-panel {
    margin-top: 16px; width: min(620px, 90vw);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
}
.settings-toggle {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    cursor: pointer; font-family: var(--font-display); font-size: 9px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
    border: none; background: transparent; width: 100%; text-align: left;
}
.settings-toggle:hover { color: var(--text-secondary); }
.settings-toggle .arrow { transition: transform 0.2s; font-size: 8px; }
.settings-toggle.open .arrow { transform: rotate(90deg); }
.settings-body { display: none; padding: 10px 16px 14px; }
.settings-body.open { display: block; }
.settings-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
}
.setting-group { display: flex; flex-direction: column; gap: 3px; }
.setting-label {
    font-family: var(--font-mono); font-size: 8px; color: var(--text-muted);
    letter-spacing: 0.08em; text-transform: uppercase;
}
.setting-input {
    font-family: var(--font-mono); font-size: 11px; padding: 5px 8px;
    background: var(--deep); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-bright); outline: none; width: 100%;
}
.setting-input:focus { border-color: rgba(0,255,229,0.4); }
.setting-input[type="range"] {
    -webkit-appearance: none; height: 4px; background: var(--border);
    border: none; padding: 0; cursor: pointer;
}
.setting-input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--cyan); cursor: pointer;
}
.setting-check {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
}
.setting-check input { accent-color: var(--cyan); }
.settings-actions {
    display: flex; gap: 8px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--border); flex-wrap: wrap;
}
.settings-btn {
    font-family: var(--font-mono); font-size: 9px; padding: 5px 12px;
    border-radius: 6px; border: 1px solid var(--border-bright); cursor: pointer;
    background: transparent; color: var(--text-secondary); transition: all 0.2s;
}
.settings-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.settings-btn.danger { border-color: rgba(255,34,68,0.3); color: var(--red); }
.settings-btn.danger:hover { border-color: var(--red); background: rgba(255,34,68,0.08); }

/* Saved channels */
.saved-channels {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; max-width: min(600px, 88vw); justify-content: center;
}
.saved-ch {
    font-family: var(--font-display); font-size: 8px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--border-bright); color: var(--text-secondary);
    cursor: pointer; transition: all 0.25s; background: transparent; max-width: 200px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    position: relative;
}
.saved-ch:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0,255,229,0.06); }
.saved-ch .ch-delete {
    display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: var(--red); cursor: pointer; padding: 0 2px;
    background: var(--surface); border-radius: 3px;
}
.saved-ch:hover .ch-delete { display: block; }

/* ═══ TV SCREEN ═══ */
#tv-screen {
    position: fixed; inset: 0; z-index: 100;
    display: none; flex-direction: column; background: #000;
}
#tv-screen.active { display: flex; }

#scene-container { position: absolute; inset: 0; overflow: hidden; }

.parallax-layer {
    position: absolute; inset: -20px;
    transition: transform 0.8s var(--ease), opacity 1.2s var(--ease);
    will-change: transform, opacity;
}
.plx-sky { z-index: 1; }
.plx-far { z-index: 2; }
.plx-mid { z-index: 3; }
.plx-near { z-index: 4; }
.plx-ground { z-index: 5; }

#ambient-particles {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none;
}

/* Visual FX layer */
#vfx-layer {
    position: absolute; inset: 0; z-index: 7; pointer-events: none;
    mix-blend-mode: screen; opacity: 0; transition: opacity 3s;
}
#vfx-layer.active { opacity: 1; }

#scene-photos {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden;
}
.scene-photo {
    position: absolute; inset: -10%; width: 120%; height: 120%;
    object-fit: cover; opacity: 0;
    filter: brightness(0.35) saturate(0.7) contrast(1.1);
    mix-blend-mode: screen;
    animation: slowPan 25s ease-in-out infinite alternate;
}
.scene-photo.visible { opacity: 0.35; transition: opacity 3s var(--ease); }

.scene-fade-out { animation: sceneFadeOut 0.8s var(--ease) forwards; }
.scene-fade-in { animation: sceneFadeIn 0.8s var(--ease) forwards; }
@keyframes sceneFadeOut { to { opacity: 0; transform: scale(1.03); } }
@keyframes sceneFadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

/* ═══ SUBTITLES ═══ */
#subtitle-area {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    z-index: 50; text-align: center; width: min(800px, 90vw);
    pointer-events: none;
}
.subtitle-name {
    font-family: var(--font-display); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 4px;
    text-shadow: 0 0 10px currentColor, 0 2px 8px rgba(0,0,0,0.8);
    transition: color 0.3s;
}
.subtitle-text {
    font-family: var(--font-serif); font-size: clamp(18px, 3vw, 26px);
    color: #fff; line-height: 1.5; text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.6);
    animation: subIn 0.35s var(--ease);
}
@keyframes subIn { from { opacity: 0; transform: translateY(8px); } }

/* Chapter overlay */
#chapter-overlay {
    position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
    opacity: 0; transition: opacity 0.8s;
}
#chapter-overlay.show { opacity: 1; }
.chapter-title {
    font-family: var(--font-display); font-size: clamp(24px, 5vw, 52px); font-weight: 900;
    letter-spacing: 0.25em; color: var(--cyan); text-align: center;
    text-shadow: 0 0 30px var(--glow-cyan), 0 0 80px rgba(0,255,229,0.15);
}
.chapter-sub {
    font-family: var(--font-serif); font-size: clamp(14px, 2vw, 20px);
    color: var(--text-secondary); margin-top: 8px; font-style: italic;
}

/* ═══ CONTROLS GROUP (bottom bars that auto-hide together) ═══ */
.controls-group {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
    opacity: 0; transition: opacity 0.4s;
}
#tv-screen:hover .controls-group,
.controls-group:focus-within { opacity: 1; }

/* Scene nav bar — above controls */
#scene-nav-bar {
    display: flex; align-items: center; justify-content: center;
    padding: 4px 14px; gap: 8px;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
}
.scene-nav-info {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-muted);
    letter-spacing: 0.05em;
}

#controls-bar {
    display: flex; align-items: center; padding: 8px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85) 40%);
}

.ctrl-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 8px; border: none;
    background: transparent; color: var(--text-secondary); cursor: pointer;
    transition: all 0.2s; flex-shrink: 0;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.ctrl-btn svg { width: 18px; height: 18px; stroke-width: 1.8; }
.ctrl-btn.active { color: var(--cyan); }
.ctrl-btn:disabled { opacity: 0.3; cursor: default; }

.ctrl-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.12); margin: 0 6px; flex-shrink: 0; }

.channel-display {
    font-family: var(--font-display); font-size: 10px; letter-spacing: 0.15em;
    color: var(--cyan); padding: 0 14px; flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 0 8px var(--glow-cyan);
}
.status-text {
    font-family: var(--font-mono); font-size: 10px; color: var(--cyan);
    margin-left: auto; padding-right: 8px; flex-shrink: 0;
    text-shadow: 0 0 8px var(--glow-cyan);
    letter-spacing: 0.05em;
}

/* ═══ CHAT PANEL ═══ */
#chat-panel {
    position: absolute; top: 0; right: -360px; bottom: 0; width: 360px;
    z-index: 70; background: var(--deep); border-left: 1px solid var(--border-bright);
    display: flex; flex-direction: column; transition: right 0.4s var(--ease);
}
#chat-panel.open { right: 0; }

.chat-header {
    display: flex; align-items: center; padding: 12px 14px;
    border-bottom: 1px solid var(--border);
}
.chat-header h3 {
    font-family: var(--font-display); font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--cyan); flex: 1;
}
.chat-close {
    width: 28px; height: 28px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.chat-close:hover { color: var(--text-bright); background: var(--hover); }

#chat-messages {
    flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.chat-msg {
    padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.6;
    max-width: 90%; animation: subIn 0.2s var(--ease);
}
.chat-msg.user {
    background: rgba(0,255,229,0.08); border: 1px solid rgba(0,255,229,0.15);
    align-self: flex-end; color: var(--text-bright);
}
.chat-msg.system {
    background: rgba(184,77,255,0.08); border: 1px solid rgba(184,77,255,0.15);
    align-self: flex-start; color: var(--text-primary);
}
.chat-msg.info {
    background: rgba(255,204,0,0.06); border: 1px solid rgba(255,204,0,0.12);
    align-self: center; color: var(--text-secondary); font-size: 10px; text-align: center;
}

.chat-input-bar {
    display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border);
}
#chat-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border-bright);
    border-radius: 8px; padding: 8px 12px; font-family: var(--font-mono);
    font-size: 12px; color: var(--text-bright); outline: none; resize: none;
    min-height: 36px; max-height: 100px;
}
#chat-input:focus { border-color: rgba(0,255,229,0.4); }
#chat-input::placeholder { color: var(--text-dim); }
.chat-send {
    width: 36px; height: 36px; border-radius: 8px; border: none;
    background: rgba(0,255,229,0.1); color: var(--cyan); cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.2s;
}
.chat-send:hover { background: rgba(0,255,229,0.2); }
.chat-send svg { width: 16px; height: 16px; }

/* ═══ PIP ═══ */
#pip-window {
    position: fixed; bottom: 20px; right: 20px; width: 240px; height: 150px;
    z-index: 300; border-radius: 10px; overflow: hidden;
    border: 2px solid var(--border-bright); background: #000;
    cursor: pointer; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); transition: all 0.3s var(--ease);
}
#pip-window:hover { border-color: var(--cyan); box-shadow: 0 8px 32px rgba(0,255,229,0.15); transform: scale(1.04); }
#pip-window canvas { width: 100%; height: 100%; }
.pip-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 4px 8px; background: rgba(0,0,0,0.7);
    font-family: var(--font-display); font-size: 7px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--cyan); text-align: center;
}

/* Channel OSD */
#channel-osd {
    position: fixed; top: 20px; right: 20px; z-index: 150;
    padding: 10px 20px; background: rgba(0,0,0,0.8);
    border: 1px solid var(--border-bright); border-radius: 8px;
    font-family: var(--font-display); display: none;
    animation: osdIn 0.3s var(--ease);
}
@keyframes osdIn { from { opacity: 0; transform: translateX(20px); } }
.osd-ch { font-size: 28px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px var(--glow-cyan); letter-spacing: 0.1em; }
.osd-topic { font-size: 9px; letter-spacing: 0.15em; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Toast */
#toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: var(--elevated); color: var(--text-bright);
    font-family: var(--font-mono); font-size: 11px;
    padding: 8px 20px; border-radius: 8px;
    border: 1px solid var(--border-bright);
    opacity: 0; transition: opacity 0.35s;
    z-index: 100000; pointer-events: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#toast.show { opacity: 1; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 0%,100%{transform:scale(1);}50%{transform:scale(1.015);} }
@keyframes drift { 0%{transform:translate(0,0);}50%{transform:translate(10px,-5px);}100%{transform:translate(0,0);} }
@keyframes slowPan { 0%{transform:translate(0,0) scale(1.05);}50%{transform:translate(-15px, 5px) scale(1.08);}100%{transform:translate(0,0) scale(1.05);} }
@keyframes floatUp { 0%{transform:translateY(100%) scale(0);opacity:0;}20%{opacity:0.6;}100%{transform:translateY(-120vh) scale(1);opacity:0;} }

@media (max-width: 768px) {
    #chat-panel { width: 100%; right: -100%; }
    #pip-window { width: 160px; height: 100px; }
    .settings-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="crt-overlay"></div>

<!-- ═══ PHASE: TUNING ═══ -->
<div id="phase-tuning">
    <div class="tuning-logo">TAIV</div>
    <div class="tuning-sub">AI Television</div>

    <div class="tuning-prompt">
        <input class="tuning-input" id="topic-input" type="text"
            placeholder="Enter a show topic… e.g. &quot;pirates in space&quot;"
            autocomplete="off" spellcheck="false">
        <button class="tuning-go" id="btn-go" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
    </div>

    <div class="model-bar" id="model-bar">
        <div class="model-dot" id="model-dot"></div>
        <span class="model-text" id="model-text">Not loaded</span>
        <div class="model-progress-bar"><div class="model-progress-fill" id="model-progress"></div></div>
        <button class="device-opt" id="btn-load-models" style="background:var(--cyan);color:var(--void);font-weight:700;padding:4px 14px;border-radius:6px;cursor:pointer;border:none;font-family:var(--font-mono);font-size:0.78rem;">Load</button>
        <div class="device-toggle" id="device-toggle">
            <button class="device-opt active" data-device="webgpu">GPU</button>
            <button class="device-opt" data-device="wasm">CPU</button>

function guessGender(name) {
    const n = (name || '').trim();
    if (!n || n.toLowerCase() === 'narrator') return 'f'; // narrator gets female voice
    // Check every word in the name (handles "Captain Jake", "Princess Mia", etc.)
    const words = n.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/);
    let fScore = 0, mScore = 0;
    for (const w of words) {
        if (FEMALE_NAMES.has(w)) fScore += 2;
        if (MALE_NAMES.has(w)) mScore += 2;
    }
    if (fScore !== mScore) return fScore > mScore ? 'f' : 'm';
    // Check name endings on the last word (likely the actual name)
    const lastName = words[words.length - 1];
    if (FEMALE_ENDINGS.test(lastName)) return 'f';
    if (MALE_ENDINGS.test(lastName)) return 'm';
    // Fallback: hash
    let h = 0;
    for (let i = 0; i < n.length; i++) h = ((h << 5) - h + n.charCodeAt(i)) | 0;
    return Math.abs(h) % 2 === 0 ? 'f' : 'm';
}

// ═══ AUDIO FX — Web Audio API reverb chain ═══
let audioCtx = null;
let reverbNode = null;
let dryGain = null;
let wetGain = null;

function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Build reverb chain
        buildReverbChain();
    }
    return audioCtx;
}

function buildReverbChain() {
    const ctx = audioCtx;
    // Create convolver reverb with synthetic IR
    reverbNode = ctx.createConvolver();
    const len = ctx.sampleRate * 2.5; // 2.5s reverb tail
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
        const data = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) {
            // Exponential decay + random noise = reverb impulse response
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
        }
    }
    reverbNode.buffer = ir;

    dryGain = ctx.createGain();
    wetGain = ctx.createGain();
    updateReverbMix();
}

function updateReverbMix() {
    if (!dryGain || !wetGain) return;
    const wet = S.reverbOn ? S.reverbAmount : 0;
    dryGain.gain.value = 1;
    wetGain.gain.value = wet;
}

function startMusic(mood) {
    if (!S.musicOn) return;
    stopMusic();
    const ctx = getAudioCtx();
    musicGain = ctx.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(ctx.destination);

    const isDark = ['dark','space','storm','mystical'].includes(mood);
    const isWarm = ['sunset','fire','desert','urban','bright'].includes(mood);

    // Choose chord – all frequencies are harmonic (just-intonation ratios)
    // Root, major 3rd, perfect 5th, octave, major 7th
    let root;
    if (isWarm) root = 130.81; // C3
    else if (isDark) root = 110.00; // A2
    else root = 87.31; // F2

    // Harmonic ratios: unison, 5:4 (maj3), 3:2 (P5), 2:1 (oct), 15:8 (maj7)
    const ratios = [1, 5/4, 3/2, 2, 15/8];
    const baseFreqs = ratios.map(r => root * r);

    // Pad layer: warm sine+triangle with LFO

        const osc = ctx.createOscillator();
        osc.type = i < 3 ? 'sine' : 'triangle';
        osc.frequency.value = baseFreqs[i];

        // Slow LFO detune for chorus-like warmth
        const lfo = ctx.createOscillator();
        lfo.frequency.value = 0.05 + i * 0.04; // staggered rates
        const lfoGain = ctx.createGain();
        lfoGain.gain.value = 1.5 + i * 0.5; // subtle widening per voice
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();

        const oscGain = ctx.createGain();
        oscGain.gain.value = 0.035 - i * 0.004; // lower harmonics louder
        osc.connect(oscGain);

        // Warm low-pass
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 350 + i * 60;
        filter.Q.value = 0.7;
        oscGain.connect(filter);
        filter.connect(musicGain);

        osc.start();
        musicNodes.push(osc, lfo, oscGain, lfoGain, filter);
    }

    // Harmonic overtone layer — pure 5th + octave, very quiet, sine only
    const overtones = [root * 3, root * 4]; // 12th and double-octave (pure harmonics)
    for (const freq of overtones) {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.value = 0.008; // barely audible shimmer
        osc.connect(g);

        trem.frequency.value = 0.15;
        const tremG = ctx.createGain();
        tremG.gain.value = 0.004;
        trem.connect(tremG);
        tremG.connect(g.gain);
        trem.start();
        g.connect(musicGain);
        osc.start();
        musicNodes.push(osc, g, trem, tremG);
    }

    // Sub bass drone — one octave below root
    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.value = root / 2;
    const subGain = ctx.createGain();
    subGain.gain.value = 0.05;
    sub.connect(subGain);
    subGain.connect(musicGain);
    sub.start();
    musicNodes.push(sub, subGain);

    // Fade in
    musicGain.gain.setTargetAtTime(MUSIC_FULL, ctx.currentTime, 3);
    musicPlaying = true;
}

function muteMusic() {
    // Fade music out before TTS series
    if (musicGain && audioCtx) {
        musicGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.6);
    }
}

function unmuteMusic() {
    // Bring music back as bridge after TTS series
    if (musicGain && audioCtx) {
        musicGain.gain.setTargetAtTime(MUSIC_FULL, audioCtx.currentTime, 0.8);
    }
}

function stopMusic() {
    if (musicGain && audioCtx) {
        try {
            musicGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
            setTimeout(() => {
                for (const n of musicNodes) { try { n.stop?.(); n.disconnect(); } catch {} }
                musicNodes = [];
            }, 2000);
        } catch {}
    }
    musicPlaying = false;
}

function updateMusicMood(mood) {
    if (musicPlaying && S.musicOn) {
        stopMusic();
        setTimeout(() => startMusic(mood), 500);
    } else if (S.musicOn && !musicPlaying) {
        startMusic(mood);
    }
}

                    const loaded = info.loaded, total = info.total;
                    updateModelUI('loading', `TTS ${Math.round(loaded/total*100)}%`, 65 + (loaded/total)*35);

        toast('Model load failed');
    }
}

// ═══ LLM GENERATION ═══
async function generateLLM(systemPrompt, userPrompt, maxTokens) {
    maxTokens = maxTokens || S.maxTokens || 500;
    if (S.preferredModel === 'ollama') return generateLLMOllama(systemPrompt, userPrompt, maxTokens);

    const T = await getTF();
    const { llmProcessor: processor, llm: model } = S;
    const conv = [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
    ];
    const textPrompt = processor.apply_chat_template(conv, { add_generation_prompt: true });
    const inputs = await processor(textPrompt);

    let full = '';
    const streamer = new T.TextStreamer(processor.tokenizer, {
        skip_prompt: true, skip_special_tokens: true,
        callback_function: text => { full += text; }
    });

    await model.generate({
        ...inputs, max_new_tokens: maxTokens,
        do_sample: true, temperature: 0.7, top_p: 0.9,
        repetition_penalty: 1.15, streamer
    });
    return full;
}

async function generateLLMOllama(systemPrompt, userPrompt, maxTokens) {
    const url = S.ollamaUrl.replace(/\/$/, '');
    const resp = await fetch(`${url}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: S.ollamaModel,
            messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt }
            ],
            stream: false,
            options: { num_predict: maxTokens, temperature: 0.7, top_p: 0.9, repeat_penalty: 1.15, num_ctx: S.contextWindow }
        })
    });
    if (!resp.ok) throw new Error(`API ${resp.status}`);
    const data = await resp.json();
    return data.message?.content || '';
}

// ═══ TTS ═══
async function generateSpeech(text, voice = 'af_heart') {
    if (!S.tts || !text.trim()) return null;
    try {
        const audio = await S.tts.generate(text.trim(), { voice });
        return audio.toBlob();
    } catch (e) {
        console.error('TTS error:', e);
        return null;
    }
}

function playBlob(blob) {
    return new Promise((resolve) => {
        if (!blob) { resolve(); return; }
        const ctx = getAudioCtx();

        const url = URL.createObjectURL(blob);
        const a = new Audio(url);
        a.playbackRate = S.audioSpeed || 0.9;
        S.currentAudio = a;

        // Connect through reverb chain if enabled
        const source = ctx.createMediaElementSource(a);
        source.connect(dryGain);
        dryGain.connect(ctx.destination);
        source.connect(reverbNode);
        reverbNode.connect(wetGain);
        wetGain.connect(ctx.destination);
        updateReverbMix();

        let resolved = false;
        const done = () => {
            if (resolved) return;
            resolved = true;
            clearTimeout(safety);
            URL.revokeObjectURL(url);
            S.currentAudio = null;
            resolve();
        };

        a.onended = done;
        a.onerror = done;
        const safety = setTimeout(() => { a.pause(); done(); }, 30000);
        a.play().catch(done);
    });
}

// ═══ VOICE ASSIGNMENT — gender-aware ═══
function getVoice(name) {
    const ch = S.channels[S.currentCh];
    if (!ch) return VOICES_F[0];
    if (!ch.voiceMap) ch.voiceMap = {};

    const gender = guessGender(name);
    const pool = gender === 'f' ? VOICES_F : VOICES_M;

    // Validate cached voice — reassign if gender doesn't match
    if (ch.voiceMap[name]) {
        const cached = ch.voiceMap[name];
        const cachedIsF = cached.startsWith('af_') || cached.startsWith('bf_');
        const wantF = gender === 'f';
        if (cachedIsF === wantF) return cached; // correct gender, keep it
        // Wrong gender — delete and reassign below
        delete ch.voiceMap[name];
    }

    const used = new Set(Object.values(ch.voiceMap));
    const available = pool.filter(v => !used.has(v));
    const voice = available.length ? available[0] : pool[Object.keys(ch.voiceMap).length % pool.length];
    ch.voiceMap[name] = voice;
    S.voiceMap = ch.voiceMap;
    saveChannels();
    return voice;
}

function getVoiceColor(voice) {
    const idx = VOICES.indexOf(voice);
    return idx >= 0 ? VOICE_COLORS[idx] : '#ffffff';
}

// ═══ WEB SEARCH ═══
async function searchTopic(topic) {
    if (!S.searchOn) return '';
    console.log(`[TAIV] Searching: "${topic}"`);
    const results = [];

    // 1. SearXNG (primary — federated, private)
    try {
        const url = (S.searxngUrl || 'https://opnxng.com').replace(/\/$/, '');
        const resp = await fetch(`${url}/search?q=${encodeURIComponent(topic)}&format=json&language=en`, {
            signal: AbortSignal.timeout(8000)
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data.results?.length) {
                for (const r of data.results.slice(0, 5)) {
                    if (r.content) results.push(r.content);
                }
                console.log(`[TAIV] SearXNG: ${results.length} snippets`);
            }
        }
    } catch (e) { console.warn('[TAIV] SearXNG failed:', e.message); }

    // 2. Wikipedia extract (reliable factual context)
    if (results.length < 3) {
        try {
            const wq = topic.split(/\s+/).slice(0, 4).join(' ');
            const resp = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wq)}`, {
                signal: AbortSignal.timeout(6000)
            });
            if (resp.ok) {
                const data = await resp.json();
                if (data.extract) {
                    results.push(data.extract);
                    console.log('[TAIV] Wikipedia: got extract');
                }
            }
        } catch (e) { console.warn('[TAIV] Wikipedia failed:', e.message); }
    }

    // 3. DuckDuckGo Instant Answers API (fallback)
    if (results.length < 2) {
        try {
            const resp = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(topic)}&format=json&no_html=1`, {
                signal: AbortSignal.timeout(6000)
            });
            if (resp.ok) {
                const data = await resp.json();
                if (data.AbstractText) results.push(data.AbstractText);
                if (data.RelatedTopics?.length) {
                    for (const rt of data.RelatedTopics.slice(0, 3)) {
                        if (rt.Text) results.push(rt.Text);
                    }
                }
                if (data.AbstractText || data.RelatedTopics?.length)
                    console.log('[TAIV] DDG: got results');
            }
        } catch (e) { console.warn('[TAIV] DDG failed:', e.message); }
    }

    const combined = results.join(' ').slice(0, 1200);
    console.log(`[TAIV] Search context: ${combined.length} chars`);
    return combined;
}

{"chapter":"The Big Mistake","scene":"a park at night","mood":"dark","lines":[{"char":"Jake","text":"I told you this was a bad idea."},{"char":"Mia","text":"Bad? This is the worst idea you ever had."},{"char":"Jake","text":"At least I have ideas."},{"char":"Mia","text":"That is not the flex you think it is."},{"char":"Sam","text":"Can you two stop? The pizza is getting cold."},{"char":"Jake","text":"See? Sam gets it. Priorities."}]}

// ═══ JSON REPAIR ═══
function repairJSON(raw) {
    let s = raw.trim();
    s = s.replace(/```json?\n?/gi, '').replace(/```/g, '').trim();
    s = s.replace(/<\/s>/g, '').replace(/<\|[^|]*\|>/g, '').trim();
    s = s.replace(/[\x00-\x1f]/g, ' ');

    const start = s.indexOf('{');
    if (start < 0) return null;
    s = s.slice(start);
    s = s.replace(/\s+/g, ' ');

    s = s.replace(/([{,]\s*)([a-zA-Z_]\w*)(\s*:)/g, '$1"$2"$3');
    s = s.replace(/([{,]\s*)'([^']+)'(\s*:)/g, '$1"$2"$3');
    s = s.replace(/:\s*'([^']*)'/g, ': "$1"');
    s = s.replace(/,(\s*[}\]])/g, '$1');

    let inStr = false, esc = false, stack = [];
    for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (inStr) { if (esc) { esc = false; continue; } if (c === '\\') { esc = true; continue; } if (c === '"') inStr = false; continue; }
        if (c === '"') { inStr = true; continue; }
        if (c === '{' || c === '[') stack.push(c);
        if (c === '}' && stack.length && stack[stack.length-1] === '{') stack.pop();
        if (c === ']' && stack.length && stack[stack.length-1] === '[') stack.pop();
    }

    if (!inStr && stack.length === 0) return s;

    const lineRx = /\{\s*"char"\s*:\s*"[^"]*"\s*,\s*"text"\s*:\s*"[^"]*"\s*\}/g;
    let lastMatch = null, m;
    while ((m = lineRx.exec(s)) !== null) lastMatch = m;
    if (lastMatch) {
        s = s.slice(0, lastMatch.index + lastMatch[0].length);
    } else {
        if (inStr) s += '"';
    }

    let ob = 0, ab = 0;
    inStr = false; esc = false;
    for (const c of s) {
        if (inStr) { if (esc) { esc=false; continue; } if (c==='\\') { esc=true; continue; } if (c==='"') inStr=false; continue; }
        if (c==='"') { inStr=true; continue; }
        if (c==='{') ob++; if (c==='}') ob--;
        if (c==='[') ab++; if (c===']') ab--;
    }
    while (ab-- > 0) s += ']';
    while (ob-- > 0) s += '}';
    s = s.replace(/,(\s*[}\]])/g, '$1');
    return s;
}

// ═══ SCENE NORMALIZATION ═══
async function generateNextScene() {
    if (!S.llmReady) return null;
    const { system, user } = buildScenePrompt();
    if (!system) return null;
    try {
        const raw = await generateLLM(system, user);
        console.log('[TAIV] Raw LLM output:', raw.slice(0, 400));
        return normalizeScene(raw);
    } catch (e) {
        console.warn('Scene gen failed:', e);
        return null;
    }
}

function normalizeScene(raw) {
    const topic = S.channels[S.currentCh]?.topic || 'the show';
    let obj = null;
    const repaired = repairJSON(raw);
    if (repaired) {
        try { obj = JSON.parse(repaired); } catch (e) {
            console.warn('[TAIV] JSON parse failed:', e.message);
        }
    }

    let chapter = '';
    if (obj) {
        chapter = obj.chapter || obj.title || obj.scene_title || obj.episode_title || obj.name || obj.heading || '';
        if (typeof chapter !== 'string') chapter = '';
    }
    if (!chapter) {
        const m = raw.match(/(?:"(?:chapter|title|scene_title|episode_title|name)")\s*:\s*"([^"]+)"/i);
        if (m) chapter = m[1];
    }
    if (!chapter) chapter = `${topic} #${S.sceneCount + 1}`;

    let mood = 'dark';
    const moodSrc = obj?.mood || obj?.scene || obj?.setting || obj?.atmosphere || '';
    if (typeof moodSrc === 'string') {
        for (const m of Object.keys(MOOD_PALETTES)) {
            if (moodSrc.toLowerCase().includes(m)) { mood = m; break; }
        }
    }

    let sceneDesc = '';
    if (obj) {
        sceneDesc = obj.scene || obj.setting || obj.description || obj.location || '';
        if (typeof sceneDesc !== 'string') sceneDesc = '';
    }

    let lines = [];
    if (obj) lines = extractLines(obj);
    if (!lines.length) {
        const rx = /"(?:char|character|name|speaker)"\s*:\s*"([^"]+)"[^}]*"(?:text|line|dialogue|says|content|action|description)"\s*:\s*"([^"]+)"/gi;
        let m;
        while ((m = rx.exec(raw)) !== null) lines.push({ char: m[1], text: m[2] });
    }
    if (!lines.length) {
        const charMatch = raw.match(/"characters"\s*:\s*\[([^\]]+)\]/);
        const descMatch = raw.match(/"(?:description|action|event)"\s*:\s*"([^"]+)"/);
        if (descMatch) lines.push({ char: 'Narrator', text: descMatch[1].trim() });
        if (charMatch && !lines.length) {
            const names = charMatch[1].match(/"([^"]+)"/g)?.map(s => s.replace(/"/g, '')) || [];
            if (names.length) lines.push({ char: 'Narrator', text: `${names.join(' and ')} enter the scene.` });
        }
    }
    if (!lines.length) lines = buildFallbackLines({ chapter }, topic);

    lines = lines.slice(0, 14).map(l => ({
        char: String(l.char || 'Narrator').replace(/[^\w\s.-]/g, '').trim() || 'Narrator',
        text: String(l.text || '').replace(/\\n/g, ' ').replace(/\\"/g, '"').trim()
    })).filter(l => l.text.length > 0);

    if (!lines.length) lines = buildFallbackLines({ chapter }, topic);

    const scene = { chapter, scene: sceneDesc, mood, img: sceneDesc ? sceneDesc.split(' ').slice(0,2).join(' ') : 'landscape', lines, _chars: [...new Set(lines.map(l => l.char))].join(', ') };
    S.sceneCount++;
    console.log(`[TAIV] Scene: "${scene.chapter}" — ${scene.lines.length} lines, mood: ${scene.mood}`);
    return scene;
}

function extractLines(obj) {
    if (!obj || typeof obj !== 'object') return [];
    const arrKeys = ['lines','script_lines','dialogue','dialogs','conversations','script','content','actions'];
    for (const key of arrKeys) {
        if (Array.isArray(obj[key]) && obj[key].length > 0) {
            const parsed = parseLineArray(obj[key]);
            if (parsed.length > 0) return parsed;
        }
    }
    if (obj.scenes) {
        if (typeof obj.scenes === 'object' && !Array.isArray(obj.scenes)) return extractLines(obj.scenes);
        if (Array.isArray(obj.scenes)) {
            for (const s of obj.scenes) { if (typeof s === 'object') { const p = extractLines(s); if (p.length > 0) return p; } }
        }
    }
    if (typeof obj.action === 'string' && obj.action.trim()) return [{ char: 'Narrator', text: obj.action.trim() }];
    if (typeof obj.description === 'string' && obj.description.trim() && obj.characters) {
        const lines = [{ char: 'Narrator', text: obj.description.trim() }];
        for (const k of ['plot_points','events','beats']) { if (Array.isArray(obj[k])) lines.push(...parseLineArray(obj[k])); }
        return lines;
    }
    for (const val of Object.values(obj)) {
        if (Array.isArray(val) && val.length > 0) { const p = parseLineArray(val); if (p.length > 0) return p; }
    }
    return [];
}

function parseLineArray(arr) {
    const lines = [];
    for (const item of arr) {
        if (typeof item === 'string' && item.trim()) { lines.push({ char: 'Narrator', text: item.trim() }); continue; }
        if (!item || typeof item !== 'object') continue;
        const char = item.char || item.character || item.name || item.speaker || item.role || 'Someone';
        const text = item.text || item.line || item.dialogue || item.says || item.content || item.action || item.description || '';
        if (typeof text === 'string' && text.trim()) lines.push({ char: String(char), text: text.trim() });
    }
    return lines;
}

function buildFallbackLines(scene, topic) {
    const title = scene?.chapter || 'this episode';
    return [
        { char: 'Narrator', text: `Welcome to ${title}. Let me set the scene for you.` },
        { char: 'Narrator', text: `In the world of ${topic}, anything can happen.` },
        { char: 'Narrator', text: 'Stay tuned as the story unfolds...' },
    ];
}

// ═══ PARALLAX RENDERER ═══
function renderScene(scene) {
    const pal = MOOD_PALETTES[scene.mood] || MOOD_PALETTES.dark;
    const isDark = ['dark','space','storm','mystical'].includes(scene.mood);

    $('#plx-sky').innerHTML = '';
    $('#plx-sky').style.background = `linear-gradient(180deg, ${pal.sky} 0%, ${pal.far} 50%, ${pal.mid} 100%)`;

    let farHTML = '';
    if (isDark) {
        for (let i = 0; i < 120; i++) {
            const x = Math.random() * 100, y = Math.random() * 70;
            const s = 0.5 + Math.random() * 2, o = 0.3 + Math.random() * 0.7;
            const tw = 3 + Math.random() * 5;
            farHTML += `<div style="position:absolute;left:${x}%;top:${y}%;width:${s}px;height:${s}px;border-radius:50%;background:#fff;opacity:${o};animation:breathe ${tw}s ease-in-out infinite ${Math.random()*5}s;"></div>`;
        }
    }
    for (let i = 0; i < 3; i++) {
