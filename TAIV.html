// ═══ VISUAL FX LAYER ═══
let vfxRAF = null;
function startVFX(mood) {
    const cv = $('#vfx-layer');
    if (!cv) return;
    const cx = cv.getContext('2d');
    if (vfxRAF) cancelAnimationFrame(vfxRAF);

    let W, H;
    function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
    resize();
    if (!cv._resizedVfx) { window.addEventListener('resize', resize); cv._resizedVfx = true; }

    cv.classList.add('active');
    const pal = MOOD_PALETTES[mood] || MOOD_PALETTES.dark;
    const isDark = ['dark','space','storm','mystical'].includes(mood);
    const isWarm = ['sunset','fire','desert','urban','bright'].includes(mood);
    const isNature = ['forest','ocean','ice'].includes(mood);
    let t = 0;

    // Mood-specific floating elements
    const floaters = [];
    const floaterCount = isDark ? 6 : (isWarm ? 8 : 5);
    for (let i = 0; i < floaterCount; i++) {
        floaters.push({
            x: Math.random() * W, y: Math.random() * H,
            size: 30 + Math.random() * 80,
            speed: 0.2 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2,
            drift: (Math.random() - 0.5) * 0.3,
            opacity: 0.02 + Math.random() * 0.04
        });
    }

    // Lightning state for storm
    let lightningTimer = 0;
    let lightningAlpha = 0;

    function draw() {
        cx.clearRect(0, 0, W, H);
        t += 0.003;

        // ─── Light rays (all moods)
        const rayCount = isDark ? 2 : (isWarm ? 4 : 3);
        for (let i = 0; i < rayCount; i++) {
            const angle = Math.sin(t * 0.5 + i * 2.1) * (isWarm ? 0.6 : 0.4);
            const x = W * (0.2 + Math.sin(t * 0.3 + i * 1.5) * 0.35);
            const width = isWarm ? 200 : 120;
            cx.save();
            cx.translate(x, 0);
            cx.rotate(angle);
            const grad = cx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, pal.accent + '0a');
            grad.addColorStop(0.3, pal.accent + '05');
            grad.addColorStop(1, 'transparent');
            cx.fillStyle = grad;
            cx.fillRect(-width/2, 0, width, H);
            cx.restore();
        }

        // ─── Floating orbs (mood-aware)
        for (const f of floaters) {
            f.x += f.drift + Math.sin(t + f.phase) * 0.3;
            f.y -= f.speed;
            if (f.y < -f.size) { f.y = H + f.size; f.x = Math.random() * W; }
            if (f.x < -f.size) f.x = W + f.size;
            if (f.x > W + f.size) f.x = -f.size;

            const pulse = f.opacity + Math.sin(t * 2 + f.phase) * 0.01;
            cx.beginPath();
            const rGrad = cx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
            rGrad.addColorStop(0, pal.accent + Math.round(pulse * 255).toString(16).padStart(2, '0'));
            rGrad.addColorStop(1, 'transparent');
            cx.fillStyle = rGrad;
            cx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            cx.fill();
        }

        // ─── Storm lightning flashes
        if (mood === 'storm') {
            lightningTimer -= 0.016;
            if (lightningTimer <= 0 && Math.random() < 0.003) {
                lightningAlpha = 0.15 + Math.random() * 0.2;
                lightningTimer = 0.05 + Math.random() * 0.1;
            }
            if (lightningAlpha > 0) {
                cx.fillStyle = `rgba(200,200,255,${lightningAlpha})`;
                cx.fillRect(0, 0, W, H);
                lightningAlpha *= 0.85;
                if (lightningAlpha < 0.005) lightningAlpha = 0;
            }
        }

        // ─── Fire embers rising
        if (mood === 'fire') {
            for (let i = 0; i < 3; i++) {
                const ex = W * (0.2 + Math.sin(t * 0.7 + i * 3) * 0.4);
                const ey = H - (t * 80 + i * 200) % (H + 100);
                const es = 2 + Math.sin(t + i) * 1.5;
                cx.beginPath();
                cx.arc(ex, ey, es, 0, Math.PI * 2);
                cx.fillStyle = `rgba(255,${120 + Math.sin(t*3+i)*60|0},20,${0.3 + Math.sin(t*2+i)*0.2})`;
                cx.fill();
            }
        }

        // ─── Ocean waves (horizontal sine)
        if (mood === 'ocean' || mood === 'ice') {
            cx.save();
            cx.globalAlpha = 0.04;
            for (let w = 0; w < 3; w++) {
                cx.beginPath();
                const waveY = H * (0.6 + w * 0.1);
                for (let x = 0; x <= W; x += 4) {
                    const y = waveY + Math.sin(x * 0.008 + t * (1.5 + w * 0.3)) * (15 + w * 8);
                    x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
                }
                cx.lineTo(W, H); cx.lineTo(0, H); cx.closePath();
                cx.fillStyle = pal.accent;
                cx.fill();
            }
            cx.restore();
        }

        // ─── Forest / nature: drifting motes of light
        if (isNature) {
            for (let i = 0; i < 5; i++) {
                const mx = (W * 0.1 + i * W * 0.2 + Math.sin(t * 0.4 + i * 1.7) * 60) % W;
                const my = H * 0.3 + Math.sin(t * 0.6 + i * 2.3) * H * 0.25;
                const ms = 3 + Math.sin(t * 1.5 + i) * 2;
                cx.beginPath();
                cx.arc(mx, my, ms, 0, Math.PI * 2);
                cx.fillStyle = pal.particle;
                cx.globalAlpha = 0.15 + Math.sin(t * 2 + i * 1.1) * 0.1;
                cx.fill();
                cx.globalAlpha = 1;
            }
        }

        // ─── Space: slow nebula color shift
        if (mood === 'space') {
            const nebX = W * (0.5 + Math.sin(t * 0.15) * 0.3);
            const nebY = H * (0.4 + Math.cos(t * 0.12) * 0.2);
            const nebR = 200 + Math.sin(t * 0.3) * 80;
            const nebGrad = cx.createRadialGradient(nebX, nebY, 0, nebX, nebY, nebR);
            const hue = (t * 15) % 360;
            nebGrad.addColorStop(0, `hsla(${hue}, 60%, 40%, 0.04)`);
            nebGrad.addColorStop(1, 'transparent');
            cx.fillStyle = nebGrad;
            cx.fillRect(nebX - nebR, nebY - nebR, nebR * 2, nebR * 2);
        }

        // ─── Pulsing vignette (all moods)
        const vigAlpha = 0.15 + Math.sin(t * 0.8) * 0.05;
        const vigGrad = cx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.7);
        vigGrad.addColorStop(0, 'transparent');
        vigGrad.addColorStop(1, `rgba(0,0,0,${vigAlpha})`);
        cx.fillStyle = vigGrad;
        cx.fillRect(0, 0, W, H);

        vfxRAF = requestAnimationFrame(draw);
    }
    draw();
}

// ═══ PHOTO SLIDESHOW — multi-source ═══
let slideshowTimer = null;
function startPhotoSlideshow(keyword, mood) {
    const container = $('#scene-photos');
    container.innerHTML = '';
    if (slideshowTimer) clearInterval(slideshowTimer);

    const words = keyword.replace(/[^a-zA-Z0-9 ]/g, '').trim().split(/\s+/).slice(0, 3);
    const query = words.join('+');
    const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return Math.abs(h); };
    const baseSeed = hash(keyword + mood + Date.now());

    // Build image URLs from multiple sources for variety
    const urls = [
        // Picsum — random high-quality photos (seeded)
        `https://picsum.photos/seed/${baseSeed}/1920/1080`,
        `https://picsum.photos/seed/${baseSeed + 7}/1920/1080`,
        `https://picsum.photos/seed/${baseSeed + 14}/1920/1080`,
        // Unsplash Source — keyword-matched photos
        `https://source.unsplash.com/1920x1080/?${query}`,
        `https://source.unsplash.com/1920x1080/?${query},${mood}`,
        // LoremFlickr — keyword-based (CORS-friendly)
        `https://loremflickr.com/1920/1080/${query}?lock=${baseSeed}`,
        `https://loremflickr.com/1920/1080/${query}?lock=${baseSeed + 3}`,
        // Picsum with different seeds for more variety
        `https://picsum.photos/seed/${baseSeed + 21}/1920/1080`,
    ];

    const imgs = [];
    for (let i = 0; i < urls.length; i++) {
        const img = document.createElement('img');
        img.className = 'scene-photo';
        img.alt = '';
        img.loading = 'eager';
        img.crossOrigin = 'anonymous';
        img.src = urls[i];
        img.onerror = () => {
            // Fallback to picsum if other sources fail
            img.src = `https://picsum.photos/seed/${baseSeed + 100 + i}/1920/1080`;
            img.onerror = () => { img.style.display = 'none'; };
        };
        img.style.animationDuration = (20 + Math.random() * 15) + 's';
        img.style.animationDelay = (-Math.random() * 10) + 's';
        container.appendChild(img);
        imgs.push(img);
    }

    let current = 0;
    const speed = (S.imageSpeed || 12) * 1000;
    setTimeout(() => { if (imgs[0]) imgs[0].classList.add('visible'); }, 400);

    slideshowTimer = setInterval(() => {
        imgs[current].classList.remove('visible');
        current = (current + 1) % imgs.length;
        imgs[current].classList.add('visible');
    }, speed);
}

let parallaxRAF = null;
function startParallax() {
    if (parallaxRAF) cancelAnimationFrame(parallaxRAF);
    const layers = [
        { el: $('#plx-sky'), speed: 0.015 },
        { el: $('#plx-far'), speed: 0.04 },
        { el: $('#plx-mid'), speed: 0.08 },
        { el: $('#plx-near'), speed: 0.15 },
        { el: $('#plx-ground'), speed: 0.06 },
    ];
    let t = 0;
    function tick() {
        t += 0.002;
        for (const l of layers) {
            const x = Math.sin(t * 0.6 + l.speed * 10) * 15 * l.speed;
            const y = Math.cos(t * 0.4 + l.speed * 7) * 10 * l.speed;
            l.el.style.transform = `translate(${x}px, ${y}px)`;
        }
        parallaxRAF = requestAnimationFrame(tick);
    }
    tick();
}

let particleRAF = null;
function startParticles(color, count = 50, mood = 'dark') {
    const cv = $('#ambient-particles');
    const cx = cv.getContext('2d');
    if (particleRAF) cancelAnimationFrame(particleRAF);

    let W, H;
    function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
    resize();
    if (!cv._resized) { window.addEventListener('resize', resize); cv._resized = true; }

    // Mood-specific particle behavior
    const isStormy = mood === 'storm' || mood === 'fire';
    const isCalm = mood === 'ocean' || mood === 'forest' || mood === 'ice';

    const particles = [];
    for (let i = 0; i < count; i++) {
        particles.push({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - 0.5) * (isStormy ? 1.2 : 0.4),
            vy: isStormy ? -Math.random() * 1 - 0.3 : (isCalm ? -Math.random() * 0.1 - 0.02 : -Math.random() * 0.3 - 0.05),
            r: 0.5 + Math.random() * (isStormy ? 3.5 : 2.5),
            opacity: 0.15 + Math.random() * 0.45,
            phase: Math.random() * Math.PI * 2
        });
    }

    function draw() {
        cx.clearRect(0, 0, W, H);
        for (const p of particles) {
            p.x += p.vx + Math.sin(p.phase) * (isCalm ? 0.02 : 0.08);
            p.y += p.vy;
            p.phase += isCalm ? 0.003 : 0.008;
            if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;
            cx.beginPath();
            cx.arc(p.x, p.y, p.r, 0, 6.28);
            cx.fillStyle = color;
            cx.globalAlpha = p.opacity;
            cx.fill();
        }
        cx.globalAlpha = 1;
        particleRAF = requestAnimationFrame(draw);
    }
    draw();
}

// ═══ SUBTITLE / CHAPTER ═══
function showLine(char, text, voice) {
    if (!S.subsOn) return;
    $('#sub-name').style.color = getVoiceColor(voice);
    $('#sub-name').textContent = char;
    $('#sub-text').textContent = text;
}
function clearSubtitles() { $('#sub-name').textContent = ''; $('#sub-text').textContent = ''; }
function showChapter(title, sub) {
    $('#chapter-title').textContent = title;
    $('#chapter-sub').textContent = sub || '';
    $('#chapter-overlay').classList.add('show');
}

// ═══ PIPELINE ═══
async function buildPacket() {
    const scene = await generateNextScene();
    if (!scene) return null;
    const audioLines = [];
    for (const line of scene.lines) {
        if (!showLoopRunning) break;
        const voice = getVoice(line.char);
        let blob = null;
        try { blob = await generateSpeech(line.text, voice); } catch {}
        audioLines.push({ char: line.char, text: line.text, voice, blob });
    }
    return { scene, audioLines };
}

async function playPacket(packet) {
    if (!packet) return;
    const { scene, audioLines } = packet;
    S.currentScene = scene;
    S.playing = true;

    // Save to channel history
    const ch = S.channels[S.currentCh];
    if (ch) {
        if (!ch.history) ch.history = [];
        ch.history.push({ chapter: scene.chapter, scene: scene.scene, mood: scene.mood, chars: scene._chars || '' });
        if (ch.history.length > 15) ch.history = ch.history.slice(-10);

        // Save scene data for replay (text only — audio is too big for localStorage)
        if (!ch.savedScenes) ch.savedScenes = [];
        ch.savedScenes.push({ chapter: scene.chapter, scene: scene.scene, mood: scene.mood, lines: scene.lines, img: scene.img });
        if (ch.savedScenes.length > 30) ch.savedScenes = ch.savedScenes.slice(-25);
        saveChannels();
    }

    // Save to played packets for scene nav
    S.playedPackets.push(packet);
    S.playedIdx = S.playedPackets.length - 1;
    updateSceneNav();

    // Transition
    const container = $('#scene-container');
    container.classList.add('scene-fade-out');
    await new Promise(r => setTimeout(r, 300));
    renderScene(scene);
    container.classList.remove('scene-fade-out');
    container.classList.add('scene-fade-in');
    setTimeout(() => container.classList.remove('scene-fade-in'), 600);

    showChapter(scene.chapter, scene.scene);
    await new Promise(r => setTimeout(r, 1200));
    $('#chapter-overlay').classList.remove('show');

    console.log(`[TAIV] Playing: "${scene.chapter}" — ${audioLines.length} lines`);

    // Mute music for entire TTS series
    muteMusic();
    await new Promise(r => setTimeout(r, 800)); // let music fade out

    for (let i = 0; i < audioLines.length; i++) {
        if (!S.playing) break;
        const al = audioLines[i];
        showLine(al.char, al.text, al.voice);
        if (al.blob) {
            await playBlob(al.blob);
        } else {
            await new Promise(r => setTimeout(r, Math.max(500, al.text.length * 30)));
        }
        if (S.playing && i < audioLines.length - 1) await new Promise(r => setTimeout(r, 1000));
    }

    clearSubtitles();
    // Music swells back as bridge between scenes
    unmuteMusic();
    S.playing = false;
}

// Replay a saved scene (regenerate TTS on the fly)
async function replayScene(sceneData) {
    const scene = sceneData;
    S.currentScene = scene;
    S.playing = true;

    // Track in playedPackets for scene nav
    S.playedPackets.push({ scene, audioLines: null });
    S.playedIdx = S.playedPackets.length - 1;
    updateSceneNav();

    const container = $('#scene-container');
    container.classList.add('scene-fade-out');
    await new Promise(r => setTimeout(r, 300));
    renderScene(scene);
    container.classList.remove('scene-fade-out');
    container.classList.add('scene-fade-in');
    setTimeout(() => container.classList.remove('scene-fade-in'), 600);

    showChapter(scene.chapter, scene.scene);
    await new Promise(r => setTimeout(r, 1200));
    $('#chapter-overlay').classList.remove('show');

    muteMusic();
    await new Promise(r => setTimeout(r, 800));

    for (let i = 0; i < scene.lines.length; i++) {
        if (!S.playing) break;
        const line = scene.lines[i];
        const voice = getVoice(line.char);
        showLine(line.char, line.text, voice);
        let blob = null;
        try { blob = await generateSpeech(line.text, voice); } catch {}
        if (blob) {
            await playBlob(blob);
        } else {
            await new Promise(r => setTimeout(r, Math.max(500, line.text.length * 30)));
        }
        if (S.playing && i < scene.lines.length - 1) await new Promise(r => setTimeout(r, 1000));
    }

    clearSubtitles();
    unmuteMusic();
    S.playing = false;
}

// ═══ SCENE NAV ═══
function updateSceneNav() {
    const ch = S.channels[S.currentCh];
    const total = ch?.savedScenes?.length || 0;
    const current = S.playedIdx + 1;
    $('#scene-nav-info').textContent = `Scene ${current}/${Math.max(total, current)}`;
    $('#btn-scene-prev').disabled = S.playedIdx <= 0;
    $('#btn-scene-next').disabled = S.playedIdx >= S.playedPackets.length - 1;
}

// ═══ MAIN SHOW LOOP ═══
let showLoopRunning = false;
let showPaused = false;

function togglePlayPause() {
    if (!showLoopRunning) {
        // Nothing running — restart
        if (S.channels[S.currentCh]) startShowLoop();
        return;
    }
    showPaused = !showPaused;
    if (showPaused) {
        // Pause current audio
        if (S.currentAudio) S.currentAudio.pause();
        S.playing = false;
        muteMusic();
        $('#status-text').textContent = '⏸ Paused';
    } else {
        // Resume current audio
        if (S.currentAudio) S.currentAudio.play().catch(() => {});
        S.playing = true;
        unmuteMusic();
        $('#status-text').textContent = '▶ On Air';
    }
    updatePlayPauseIcon();
}

function updatePlayPauseIcon() {
    const icon = $('#icon-playpause');
    if (!icon) return;
    if (showLoopRunning && !showPaused) {
        // Show pause icon
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    } else {
        // Show play icon
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }
}

async function waitWhilePaused() {
    while (showPaused && showLoopRunning) {
        await new Promise(r => setTimeout(r, 200));
    }
}

async function startShowLoop() {
    if (showLoopRunning) return;
    showLoopRunning = true;
    showPaused = false;
    updatePlayPauseIcon();
    S.playedPackets = [];
    S.playedIdx = -1;

    const ch = S.channels[S.currentCh];
    const saved = ch?.savedScenes || [];
    S.sceneCount = 0;

    // Start music
    if (S.musicOn) startMusic('dark');

    // Phase 1: Replay all saved scenes from part 1
    for (let i = 0; i < saved.length && showLoopRunning; i++) {
        await waitWhilePaused();
        if (!showLoopRunning) break;
        $('#status-text').textContent = `Replaying ${i + 1}/${saved.length}…`;
        S.sceneCount = i;
        await replayScene(saved[i]);
        if (!showLoopRunning) break;

        // If this is the last saved scene, start generating new ones
        if (i === saved.length - 1) break;
    }

    // Phase 2: Set sceneCount to continue from where saved left off
    S.sceneCount = saved.length;

    // Phase 3: Generate new scenes going forward
    while (showLoopRunning && S.channels[S.currentCh]) {
        await waitWhilePaused();
        if (!showLoopRunning) break;

        $('#status-text').textContent = 'Writing…';
        let currentPacket = await buildPacket();
        if (!currentPacket && showLoopRunning) currentPacket = await buildPacket();
        if (!currentPacket) {
            if (!showLoopRunning) break;
            await new Promise(r => setTimeout(r, 1000));
            continue;
        }

        await waitWhilePaused();
        if (!showLoopRunning) break;

        $('#status-text').textContent = '▶ On Air';

        // Start building next while playing current
        const nextPromise = showLoopRunning
            ? buildPacket().catch(e => { console.warn('[TAIV] Next packet failed:', e); return null; })
            : null;

        await playPacket(currentPacket);
        if (!showLoopRunning) break;

        // Get next (should be ready)
        if (nextPromise) {
            $('#status-text').textContent = 'Loading next…';
            const next = await nextPromise;
            if (next) {
                // Inject into loop by continuing
                await waitWhilePaused();
                if (!showLoopRunning) break;
                $('#status-text').textContent = '▶ On Air';

                const nextNext = showLoopRunning
                    ? buildPacket().catch(() => null)
                    : null;

                await playPacket(next);
                if (!showLoopRunning) break;

                // Re-enter the standard loop pattern but nextNext is already building
                // We'll just fall through to the top of the while
            }
        }
    }
}

function stopShowLoop() {
    showLoopRunning = false;
    showPaused = false;
    S.playing = false;
    if (S.currentAudio) { S.currentAudio.pause(); S.currentAudio = null; }
    if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
    stopMusic();
    clearSubtitles();
    updatePlayPauseIcon();
}

// ═══ CHANNEL MANAGEMENT ═══
function switchToChannel(idx) {
    if (idx < 0 || idx >= S.channels.length) return;
    stopShowLoop();
    S.currentCh = idx;
    const ch = S.channels[idx];
    S.voiceMap = ch.voiceMap || {};
    const chNum = String(idx + 1).padStart(2, '0');
    $('#channel-display').textContent = `CH ${chNum} — ${ch.topic}`;
    showOSD(chNum, ch.topic);
    setTimeout(() => startShowLoop(), 500);
}

function showOSD(ch, topic) {
    const osd = $('#channel-osd');
    $('#osd-ch').textContent = ch;
    $('#osd-topic').textContent = topic;
    osd.style.display = 'block';
    clearTimeout(osd._t);
    osd._t = setTimeout(() => osd.style.display = 'none', 3000);
}

async function startNewChannel(topic) {
    S.channels = S.channels.filter(c => c.topic !== topic);
    S.channels.push({ topic, history: [], voiceMap: {}, savedScenes: [] });
    saveChannels();
    // Web search for topic context before starting
    if (S.searchOn) {
        $('#status-text').textContent = 'Researching…';
        try { S.topicContext = await searchTopic(topic); }
        catch (e) { console.warn('[TAIV] Search failed:', e); S.topicContext = ''; }
    } else {
        S.topicContext = '';
    }
    switchToChannel(S.channels.length - 1);
}

function deleteChannel(idx) {
    if (idx < 0 || idx >= S.channels.length) return;
    S.channels.splice(idx, 1);
    saveChannels();
    if (S.currentCh >= S.channels.length) S.currentCh = Math.max(0, S.channels.length - 1);
    renderSavedChannels();
    toast('Channel deleted');
}

// ═══ TUNING PHASE ═══
function renderSavedChannels() {
    const container = $('#saved-channels');
    container.innerHTML = '';
    S.channels.forEach((ch, i) => {
        const btn = document.createElement('button');
        btn.className = 'saved-ch';
        btn.innerHTML = `${esc(ch.topic)}<span class="ch-delete" data-idx="${i}">&times;</span>`;
        btn.title = ch.topic;
        btn.onclick = (e) => {
            if (e.target.classList.contains('ch-delete')) {
                e.stopPropagation();
                deleteChannel(parseInt(e.target.dataset.idx));
                return;
            }
            showTV();
            switchToChannel(i);
        };
        container.appendChild(btn);
    });
}

function updateGoBtn() {
    const input = $('#topic-input');
    $('#btn-go').disabled = !(S.llmReady && S.ttsReady && input.value.trim());
}

function showTV() {
    $('#phase-tuning').classList.add('hidden');
    $('#tv-screen').classList.add('active');
    S.phase = 'tv';
    renderScene({ mood: 'dark', scene: '', chapter: '', lines: [] });
}

function showTuning() {
    stopShowLoop();
    S.phase = 'tuning';
    $('#tv-screen').classList.remove('active');
    $('#phase-tuning').classList.remove('hidden');
    renderSavedChannels();
    if (S.channels.length > 0) showPiP();
}

// ═══ PiP ═══
let pipInterval = null;
function showPiP() {
    const pip = $('#pip-window');
    const ch = S.channels[S.currentCh];
    if (!ch) { pip.style.display = 'none'; return; }
    pip.style.display = 'block';
    $('#pip-label').textContent = ch.topic;
    const cv = $('#pip-canvas');
    const cx = cv.getContext('2d');
    cv.width = 240; cv.height = 150;
    if (pipInterval) clearInterval(pipInterval);
    pipInterval = setInterval(() => {
        const pal = MOOD_PALETTES[S.currentScene?.mood || 'dark'];
        const grad = cx.createLinearGradient(0, 0, 0, 150);
        grad.addColorStop(0, pal.sky); grad.addColorStop(1, pal.ground);
        cx.fillStyle = grad; cx.fillRect(0, 0, 240, 150);
        cx.fillStyle = pal.particle; cx.globalAlpha = 0.5;
        for (let i = 0; i < 8; i++) {
            cx.beginPath();
            cx.arc(30 + Math.sin(Date.now()*0.001+i)*60+i*20, 40+Math.cos(Date.now()*0.0008+i*2)*30, 2, 0, Math.PI*2);
            cx.fill();
        }
        cx.globalAlpha = 1;
    }, 100);
}
function hidePiP() {
    $('#pip-window').style.display = 'none';
    if (pipInterval) { clearInterval(pipInterval); pipInterval = null; }
}

// ═══ CHAT / DIRECTOR ═══
function addChatMsg(text, type = 'system') {
    const el = document.createElement('div');
    el.className = `chat-msg ${type}`;
    el.textContent = text;
    $('#chat-messages').appendChild(el);
    $('#chat-messages').scrollTop = $('#chat-messages').scrollHeight;
}
function sendDirection(text) {
    if (!text.trim()) return;
    addChatMsg(text, 'user');
    S.directorNotes.push(text);
    addChatMsg('Direction noted — next scene.', 'info');
    $('#chat-input').value = '';
}

// ═══ EXPORT / IMPORT ═══
function exportData() {
    const data = {
        settings: JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'),
        channels: JSON.parse(localStorage.getItem('taiv_channels') || '[]'),
        version: 2,
        date: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `taiv-backup-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Data exported');
}

function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.settings) localStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings));
            if (data.channels) localStorage.setItem('taiv_channels', JSON.stringify(data.channels));
            loadSettings();
            loadChannels();
            applySettingsToUI();
            renderSavedChannels();
            toast('Data imported — reload for full effect');
        } catch (err) {
            toast('Import failed: invalid file');
        }
    };
    reader.readAsText(file);
}

function clearAllData() {
    if (!confirm('Delete ALL TAIV data? This cannot be undone.')) return;
    localStorage.removeItem(SETTINGS_KEY);
    localStorage.removeItem('taiv_channels');
    S.channels = [];
    renderSavedChannels();
    toast('All data cleared');
}

// ═══ FULLSCREEN ═══
function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
}

// ═══ SETTINGS UI SYNC ═══
function applySettingsToUI() {
    const setVal = (id, val) => { const el = $(id); if (el) el.value = val; };
    setVal('#cfg-lines', S.linesPerScene);
    setVal('#cfg-ctx', S.contextWindow);
    setVal('#cfg-tokens', S.maxTokens);
    setVal('#cfg-img-speed', S.imageSpeed);
    setVal('#cfg-audio-speed', S.audioSpeed);
    setVal('#cfg-reverb', S.reverbAmount);
    setVal('#cfg-ollama-url', S.ollamaUrl);
    setVal('#cfg-ollama-model', S.ollamaModel);
    const chk = (id, val) => { const el = $(id); if (el) el.checked = val; };
    chk('#cfg-reverb-on', S.reverbOn);
    chk('#cfg-music-on', S.musicOn);
    chk('#cfg-search-on', S.searchOn);
    chk('#cfg-images-on', S.imagesOn);
    setVal('#cfg-searxng-url', S.searxngUrl);
    $('#cfg-audio-speed-val').textContent = S.audioSpeed + '×';
    $('#cfg-reverb-val').textContent = S.reverbAmount.toFixed(2);

    // Active buttons
    $$('#model-toggle .device-opt').forEach(b => b.classList.toggle('active', b.dataset.model === S.preferredModel));
    $$('#device-toggle .device-opt').forEach(b => b.classList.toggle('active', b.dataset.device === S.preferredDevice));
    $('#device-toggle').style.display = S.preferredModel === 'ollama' ? 'none' : 'flex';
    $('#ollama-settings').style.display = S.preferredModel === 'ollama' ? 'grid' : 'none';
}

// ═══ EVENT WIRING ═══
function setupEvents() {
    // Settings toggle
    $('#settings-toggle').addEventListener('click', () => {
        $('#settings-toggle').classList.toggle('open');
        $('#settings-body').classList.toggle('open');
    });

    // Device toggle — save preference only
    $$('#device-toggle .device-opt').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('active')) return;
            $$('#device-toggle .device-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            S.preferredDevice = btn.dataset.device;
            S.llmReady = false; S.ttsReady = false;
            updateGoBtn(); saveSettings();
            updateModelUI('idle', `${S.preferredModel} / ${btn.dataset.device === 'webgpu' ? 'GPU' : 'CPU'} — click Load`, 0);
        });
    });

    // Model toggle — save preference only
    $$('#model-toggle .device-opt').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('active')) return;
            $$('#model-toggle .device-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            S.preferredModel = btn.dataset.model;
            $('#ollama-settings').style.display = S.preferredModel === 'ollama' ? 'grid' : 'none';
            $('#device-toggle').style.display = S.preferredModel === 'ollama' ? 'none' : 'flex';
            S.llmReady = false; S.ttsReady = false;
            updateGoBtn(); saveSettings();
            updateModelUI('idle', `${btn.dataset.model}${btn.dataset.model === 'ollama' ? '' : ' / ' + S.preferredDevice} — click Load`, 0);
        });
    });

    // Load button
    $('#btn-load-models').addEventListener('click', () => {
        $('#btn-load-models').disabled = true;
        loadModels().finally(() => { $('#btn-load-models').disabled = false; });
    });

    // Settings inputs — save on change
    const bindInput = (id, key, parse = v => v) => {
        const el = $(id);
        if (!el) return;
        el.addEventListener('change', () => {
            S[key] = parse(el.value);
            saveSettings();
        });
    };
    bindInput('#cfg-lines', 'linesPerScene', v => Math.max(3, Math.min(20, parseInt(v) || 8)));
    bindInput('#cfg-ctx', 'contextWindow', v => Math.max(512, Math.min(8192, parseInt(v) || 2048)));
    bindInput('#cfg-tokens', 'maxTokens', v => Math.max(200, Math.min(2000, parseInt(v) || 500)));
    bindInput('#cfg-img-speed', 'imageSpeed', v => Math.max(3, Math.min(60, parseInt(v) || 12)));
    bindInput('#cfg-ollama-url', 'ollamaUrl', v => v.trim() || 'http://localhost:11434');
    bindInput('#cfg-ollama-model', 'ollamaModel', v => v.trim() || 'qwen3:4b');

    $('#cfg-audio-speed').addEventListener('input', (e) => {
        S.audioSpeed = parseFloat(e.target.value);
        $('#cfg-audio-speed-val').textContent = S.audioSpeed.toFixed(2) + '×';
        saveSettings();
    });
    $('#cfg-reverb').addEventListener('input', (e) => {
        S.reverbAmount = parseFloat(e.target.value);
        $('#cfg-reverb-val').textContent = S.reverbAmount.toFixed(2);
        updateReverbMix();
        saveSettings();
    });
    $('#cfg-reverb-on').addEventListener('change', (e) => {
        S.reverbOn = e.target.checked;
        updateReverbMix();
        saveSettings();
    });
    $('#cfg-music-on').addEventListener('change', (e) => {
        S.musicOn = e.target.checked;
        if (S.musicOn && S.phase === 'tv') startMusic(S.currentScene?.mood || 'dark');
        else stopMusic();
        saveSettings();
    });
    $('#cfg-search-on').addEventListener('change', (e) => {
        S.searchOn = e.target.checked;
        saveSettings();
    });
    $('#cfg-images-on').addEventListener('change', (e) => {
        S.imagesOn = e.target.checked;
        if (!S.imagesOn) {
            $('#scene-photos').innerHTML = '';
            if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
        } else if (S.currentScene) {
            startPhotoSlideshow(S.currentScene.img || S.currentScene.scene || 'landscape', S.currentScene.mood);
        }
        saveSettings();
    });
    bindInput('#cfg-searxng-url', 'searxngUrl', v => v.trim() || 'https://opnxng.com');

    // Export / Import / Clear
    $('#btn-export').addEventListener('click', exportData);
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', (e) => { if (e.target.files[0]) importData(e.target.files[0]); });
    $('#btn-clear-all').addEventListener('click', clearAllData);

    // Tuning input
    const topicInput = $('#topic-input');
    topicInput.addEventListener('input', updateGoBtn);
    topicInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !$('#btn-go').disabled) { e.preventDefault(); launchChannel(); }
    });
    $('#btn-go').addEventListener('click', launchChannel);

    async function launchChannel() {
        const topic = topicInput.value.trim();
        if (!topic) return;
        topicInput.value = '';
        hidePiP(); showTV();
        await startNewChannel(topic);
    }

    // Channel buttons
    $('#btn-prev').addEventListener('click', () => {
        if (S.channels.length < 2) return;
        switchToChannel((S.currentCh - 1 + S.channels.length) % S.channels.length);
    });
    $('#btn-next').addEventListener('click', () => {
        if (S.channels.length <= 1) { showTuning(); $('#topic-input').focus(); return; }
        const next = (S.currentCh + 1) % S.channels.length;
        if (next === S.currentCh) { showTuning(); $('#topic-input').focus(); }
        else switchToChannel(next);
    });

    // Scene nav buttons
    $('#btn-scene-prev').addEventListener('click', async () => {
        if (S.playedIdx <= 0) return;
        S.playing = false; // stop current
        if (S.currentAudio) { S.currentAudio.pause(); S.currentAudio = null; }
        S.playedIdx--;
        updateSceneNav();
        const pkt = S.playedPackets[S.playedIdx];
        if (pkt) await playPacket(pkt);
    });
    $('#btn-scene-next').addEventListener('click', async () => {
        if (S.playedIdx >= S.playedPackets.length - 1) return;
        S.playing = false;
        if (S.currentAudio) { S.currentAudio.pause(); S.currentAudio = null; }
        S.playedIdx++;
        updateSceneNav();
        const pkt = S.playedPackets[S.playedIdx];
        if (pkt) await playPacket(pkt);
    });

    // Play/Pause
    $('#btn-playpause').addEventListener('click', togglePlayPause);

    // Home button
    $('#btn-home').addEventListener('click', () => showTuning());

    // Music toggle
    $('#btn-music').addEventListener('click', () => {
        S.musicOn = !S.musicOn;
        $('#btn-music').classList.toggle('active', S.musicOn);
        if (S.musicOn) startMusic(S.currentScene?.mood || 'dark');
        else stopMusic();
        const chk = $('#cfg-music-on');
        if (chk) chk.checked = S.musicOn;
        saveSettings();
        toast(S.musicOn ? 'Music ON' : 'Music OFF');
    });

    // Chat
    $('#btn-chat').addEventListener('click', () => {
        S.chatOpen = !S.chatOpen;
        $('#chat-panel').classList.toggle('open', S.chatOpen);
        $('#btn-chat').classList.toggle('active', S.chatOpen);
        if (S.chatOpen) $('#chat-input').focus();
    });
    $('#chat-close-btn').addEventListener('click', () => {
        S.chatOpen = false;
        $('#chat-panel').classList.remove('open');
        $('#btn-chat').classList.remove('active');
    });
    $('#chat-send-btn').addEventListener('click', () => sendDirection($('#chat-input').value));
    $('#chat-input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDirection($('#chat-input').value); }
    });

    // Subtitles
    $('#btn-subs').addEventListener('click', () => {
        S.subsOn = !S.subsOn;
        $('#btn-subs').classList.toggle('active', S.subsOn);
        if (!S.subsOn) clearSubtitles();
        toast(S.subsOn ? 'Subtitles ON' : 'Subtitles OFF');
    });

    // Fullscreen
    $('#btn-fs').addEventListener('click', toggleFullscreen);

    // PiP
    $('#pip-window').addEventListener('click', () => {
        hidePiP(); showTV();
        if (!showLoopRunning && S.channels[S.currentCh]) {
            const chNum = String(S.currentCh + 1).padStart(2, '0');
            $('#channel-display').textContent = `CH ${chNum} — ${S.channels[S.currentCh].topic}`;
            startShowLoop();
        }
    });

    // Keyboard
    document.addEventListener('keydown', e => {
        if (S.phase !== 'tv') return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        switch (e.key) {
            case 'f': case 'F': toggleFullscreen(); break;
            case 'c': case 'C':
                S.chatOpen = !S.chatOpen;
                $('#chat-panel').classList.toggle('open', S.chatOpen);
                $('#btn-chat').classList.toggle('active', S.chatOpen);
                if (S.chatOpen) $('#chat-input').focus();
                break;
            case 's': case 'S':
                S.subsOn = !S.subsOn;
                $('#btn-subs').classList.toggle('active', S.subsOn);
                if (!S.subsOn) clearSubtitles();
                toast(S.subsOn ? 'Subtitles ON' : 'Subtitles OFF');
                break;
            case ' ':
                e.preventDefault();
                togglePlayPause();
                break;
            case 'm': case 'M':
                $('#btn-music').click();
                break;
            case 'ArrowLeft': $('#btn-prev').click(); break;
            case 'ArrowRight': $('#btn-next').click(); break;
            case 'Escape':
                if (S.chatOpen) {
                    S.chatOpen = false;
                    $('#chat-panel').classList.remove('open');
                    $('#btn-chat').classList.remove('active');
                } else { showTuning(); }
                break;
        }
    });
}

// ═══ INIT ═══
async function init() {
    loadSettings();
    loadChannels();
    applySettingsToUI();
    renderSavedChannels();
    setupEvents();

    // Init subtitles button state
    $('#btn-subs').classList.toggle('active', S.subsOn);
    $('#btn-music').classList.toggle('active', S.musicOn);

    updateModelUI('idle', `${S.preferredModel}${S.preferredModel === 'ollama' ? '' : ' / ' + S.preferredDevice} — click Load`, 0);
}

init();
</script>
</body>
